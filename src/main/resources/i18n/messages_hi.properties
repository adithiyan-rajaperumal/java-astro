yoga.gajakesari=गजकेसरी योग
yoga.gajakesari.desc=चंद्रमा से केंद्र में गुरु स्थित है। धन, बुद्धि और सद्गुण प्रदान करता है।
yoga.budha_aditya=बुधादित्य योग
yoga.budha_aditya.desc=सूर्य और बुध की युति। तीव्र बुद्धि, प्रसिद्धि और संचार कौशल देता है।
yoga.chandra_mangal=चंद्र मंगल योग
yoga.chandra_mangal.desc=चंद्रमा और मंगल की युति। आर्थिक समृद्धि और धन लाभ देता है।
yoga.ruchaka=रुचक योग (पंच महापुरुष योग)
yoga.ruchaka.desc=मंगल केंद्र में स्व/उच्च राशि में है। नेतृत्व, साहस और शारीरिक शक्ति प्रदान करता है।
yoga.bhadra=भद्र योग (पंच महापुरुष योग)
yoga.bhadra.desc=बुध केंद्र में स्व/उच्च राशि में है। उच्च बुद्धि, व्यापारिक सफलता और दीर्घायु देता है।
yoga.hamsa=हंस योग (पंच महापुरुष योग)
yoga.hamsa.desc=गुरु केंद्र में स्व/उच्च राशि में है। ज्ञान, आध्यात्मिक झुकाव और आदर प्रदान करता है।
yoga.malavya=मालव्य योग (पंच महापुरुष योग)
yoga.malavya.desc=शुक्र केंद्र में स्व/उच्च राशि में है। सुख-सुविधाएं, कलात्मक प्रतिभा और आकर्षण प्रदान करता है।
yoga.sasa=शश योग (पंच महापुरुष योग)
yoga.sasa.desc=शनि केंद्र में स्व/उच्च राशि में है। अधिकार, धैर्य और दृढ़ता प्रदान करता है।
yoga.neechabhanga=नीचभंग राजयोग
yoga.neechabhanga.desc=नीच ग्रह का डिस्पोजिटर केंद्र में स्थित होने से नीचभंग होकर राजयोग फल मिलता है।
yoga.dharma_karmadhipati=धर्म-कर्माधिपति योग
yoga.dharma_karmadhipati.desc=9वें (धर्म) और 10वें (कर्म) भाव के स्वामियों की युति या दृष्टि। उच्च व्यावसायिक सफलता और सम्मान देता है।
yoga.rajayogam=केंद्र-त्रिकोण राजयोग
yoga.rajayogam.desc=केंद्र स्वामी (1,4,7,10) और त्रिकोण स्वामी (5,9) की युति। अपार समृद्धि और सफलता देता है।
yoga.lakshmi=लक्ष्मी योग
yoga.lakshmi.desc=9वां स्वामी केंद्र/त्रिकोण में स्व/उच्च राशि में और लग्नेश बलवान है। अपार धन, समृद्धि और सद्गुण प्रदान करता है।
yoga.amala=अमल योग
yoga.amala.desc=लग्न या चंद्रमा से 10वें भाव में शुभ ग्रह स्थित होने से निष्कलंक प्रतिष्ठा और उच्च पद मिलता है।
yoga.parijata=पारिजात योग
yoga.parijata.desc=लग्नेश का डिस्पोजिटर और उसका स्वामी केंद्र/त्रिकोण में स्व/उच्च राशि में स्थित हैं। जीवन के उत्तरार्ध में उच्च प्रसिद्धि और मान-सम्मान देता है।
yoga.chatussagara=चतुःसागर योग
yoga.chatussagara.desc=सभी चारों केंद्र भावों (1, 4, 7, 10) में ग्रह स्थित हैं। अटूट करियर स्थिरता और आजीवन वित्तीय सुरक्षा देता है।
yoga.mala=माला योग
yoga.mala.desc=सभी तीनों शुभ ग्रह (गुरु, शुक्र, बुध) केंद्र में हैं और केंद्र में कोई पाप ग्रह नहीं है। अपार धन, सद्गुण और प्रतिष्ठा देता है।
yoga.indra=इंद्र योग
yoga.indra.desc=5वें और 11वें भाव के स्वामियों का राशि परिवर्तन अथवा 11वें स्वामी का 5वें में और चंद्रमा का 11वें में होना। राजसी पद और सम्मान देता है।
yoga.kendra_trikona_sambandha=केंद्र-त्रिकोण संबंध राजयोग
yoga.kendra_trikona_sambandha.desc=केंद्र और त्रिकोण के स्वामियों की युति, दृष्टि अथवा परिवर्तन। जीवन में तीव्र उन्नति और सफलता प्रदान करता है।
yoga.bhagyalakshmi=भाग्यलक्ष्मी योग
yoga.bhagyalakshmi.desc=9वां स्वामी केंद्र/त्रिकोण में स्व/उच्च राशि में तथा गुरु और शुक्र केंद्र/त्रिकोण में स्थित हैं। अपार सौभाग्य और समृद्धि देता है।
yoga.rajalakshmi=राजलक्ष्मी योग
yoga.rajalakshmi.desc=गुरु, शुक्र, बुध और चंद्रमा बिना पाप प्रभाव के केंद्र/त्रिकोण में स्थित हैं। राजसी सुख और वैभव देता है।
yoga.adhi=अधि योग
yoga.adhi.desc=चंद्रमा या लग्न से 6, 7 और 8वें भाव में शुभ ग्रह स्थित हैं। नेतृत्व क्षमता और विरोधियों पर विजय देता है।
yoga.vasumathi=वसुमती योग
yoga.vasumathi.desc=सभी शुभ ग्रह उपचय भावों (3, 6, 10, 11) में स्थित हैं। स्वतंत्र धन अर्जन और वित्तीय स्वतंत्रता देता है।
yoga.akhanda_samrajya=अखंड साम्राज्य योग
yoga.akhanda_samrajya.desc=स्थिर/चर लग्न में गुरु और 2/9/11वें भाव के स्वामी केंद्र में स्थित हैं। स्थायी अधिकार और समृद्धि देता है।
yoga.saraswati=सरस्वती योग
yoga.saraswati.desc=गुरु, शुक्र और बुध केंद्र/त्रिकोण/2रे भाव में स्थित हैं। उच्च ज्ञान, वाकपटुता और कलात्मक निपुणता देता है।
yoga.kalanidhi=कलानिधि योग
yoga.kalanidhi.desc=गुरु 2रे या 5वें भाव में बुध और शुक्र से युक्त या दृष्ट हैं। बहुमुखी प्रतिभा और आदर प्रदान करता है।
yoga.kahala=काहल योग
yoga.kahala.desc=4थे और 9वें स्वामी परस्पर केंद्र में स्थित हैं। साहस, वाहन सुख और नेतृत्व क्षमता देता है।
yoga.parvata=पर्वत योग
yoga.parvata.desc=केंद्र में शुभ ग्रह स्थित हैं और 6/8वें भाव रिक्त या शुभ ग्रहों से युक्त हैं। अचल संपत्ति और स्थिर प्रतिष्ठा देता है।
yoga.pushkala=पुष्कल योग
yoga.pushkala.desc=चंद्रमा का डिस्पोजिटर लग्नेश के साथ केंद्र/त्रिकोण में स्थित होकर लग्न को देखता है। प्रसिद्धि और आकर्षक व्यक्तित्व देता है।
yoga.shakata=शकट योग
yoga.shakata.desc=गुरु से 6/8/12वें भाव में चंद्रमा स्थित है, जिससे जीवन में उतार-चढ़ाव आते हैं।
yoga.shubhakarthari=शुभकर्तरी योग
yoga.shubhakarthari.desc=लग्न, चंद्रमा या 10वें भाव के दोनों ओर (2रे और 12वें) शुभ ग्रह स्थित हैं। सुरक्षा और उन्नति प्रदान करता है।
yoga.mahabhagya=महाभाग्य योग
yoga.mahabhagya.desc=दिन/रात जन्म और लग्न/सूर्य/चंद्रमा के विषम/सम राशियों में होने से असाधारण आजीवन भाग्य मिलता है।
yoga.chamara=चामर योग
yoga.chamara.desc=उच्च का लग्नेश केंद्र में गुरु की दृष्टि से युक्त है या 7/9/10वें भाव में शुभ ग्रह हैं। उच्च पद और दीर्घायु देता है।
yoga.vesi=वेसि योग
yoga.vesi.desc=सूर्य से 2रे भाव में शुभ ग्रह स्थित हैं। वाकपटुता और समृद्धि देता है।
yoga.vosi=वोसि योग
yoga.vosi.desc=सूर्य से 12वें भाव में शुभ ग्रह स्थित हैं। आध्यात्मिक रुझान और प्रतिष्ठा देता है।
yoga.obhayachari=उभयचारी योग
yoga.obhayachari.desc=सूर्य के दोनों ओर (2रे और 12वें) शुभ ग्रह स्थित हैं। जीवन में स्थिरता और यश देता है।
yoga.sunapha=सुनफा योग
yoga.sunapha.desc=चंद्रमा से 2रे भाव में ग्रह स्थित हैं। बुद्धि, संपत्ति और प्रतिष्ठा देता है।
yoga.anapha=अनफा योग
yoga.anapha.desc=चंद्रमा से 12वें भाव में ग्रह स्थित हैं। शारीरिक आकर्षण और सदाचार देता है।
yoga.dhurudhura=दुरुधुरा योग
yoga.dhurudhura.desc=चंद्रमा के दोनों ओर (2रे और 12वें) ग्रह स्थित हैं। अत्यधिक धन, वाहन और नेतृत्व देता है।
yoga.kemadruma=केमद्रुम योग
yoga.kemadruma.desc=चंद्रमा के 2रे और 12वें भाव में कोई ग्रह नहीं है। केमद्रुम भंग होने पर दोष समाप्त हो जाता है।
yoga.pravrajya=प्रव्रज्या / संन्यास योग
yoga.pravrajya.desc=एक ही भाव में 4 या अधिक ग्रहों की युति, जो दार्शनिक सोच या विशेष तकनीकी निपुणता देती है।
yoga.vipareeta=विपरीत राजयोग
yoga.vipareeta.desc=6, 8, 12वें भाव के स्वामी त्रिक भावों में स्थित होकर अचानक सफलता और धन लाभ देते हैं।

