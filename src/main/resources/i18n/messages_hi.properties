dosham.angarak=अंगारक दोष
remedy.angarak=मंगलवार को भगवान कार्तिकेय / हनुमान जी की पूजा करें।
dosham.punarphoo=पुनर्भू दोष (विष दोष)
remedy.punarphoo=सोमवार को शिवलिंग पर जलाभिषेक करें और महामृत्युंजय मंत्र का जाप करें।
dosham.papakarthari=पापकर्तरी दोष
remedy.papakarthari=गायत्री मंत्र का जाप करें और नवग्रह परिक्रमा करें।
dosham.grahan=ग्रहण दोष
remedy.grahan=भगवान शिव का रुद्राभिषेक करें और सूर्य/चंद्र गायत्री मंत्र का जाप करें।
dosham.daridra=दरिद्र योग (वित्तीय बाधा)
remedy.daridra=शुक्रवार को महालक्ष्मी और कुबेर जी की पूजा करें।
dosham.duryoga=दुर्योंग (करियर अवरोध)
remedy.duryoga=श्री गणेश जी की उपासना करें और नित्य सूर्य नमस्कार करें।
dosham.sarpa=सर्प दोष
remedy.sarpa=नाग देवता की पूजा करें और राहु-केतु शांति करवाएं।
dosham.kendra_adhipatya=केंद्राधिपत्य दोष
remedy.kendra_adhipatya=गुरुवार को भगवान शिव और दक्षिणामूर्ति की पूजा करें।
dosham.bhadhakadhipati=बाधकाधिपति दोष
remedy.bhadhakadhipati=इष्ट देवता और कुल देवता की नित्य पूजा करें।
dosham.gandanta=गंडान्त दोष
remedy.gandanta=गंडान्त शांति पूजा करवाएं और महामृत्युंजय मंत्र का जाप करें।
