nullification.sevvai.own_exalted=ಕುಜ ಸ್ವಕ್ಷೇತ್ರ ಅಥವಾ ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ.
nullification.sevvai.jupiter_aspect=ಗುರು ಕುಜನನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ ಅಥವಾ ಯುತಿಯಲ್ಲಿದ್ದಾನೆ.
nullification.sevvai.venus_aspect=ಶುಕ್ರ ಕುಜನನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.
nullification.sevvai.benefic_sign=1 ಅಥವಾ 2ನೇ ಮನೆಯಲ್ಲಿ ಶುಭ ರಾಶಿಯಲ್ಲಿ ಕುಜನಿದ್ದಾನೆ.

nullification.kalasarpa.conjunct=ಒಂದು ಗ್ರಹ ರಾಹು ಅಥವಾ ಕೇತುವಿನೊಂದಿಗೆ ಯುತಿಯಲ್ಲಿದೆ.
nullification.kalasarpa.jupiter_aspect=ಗುರು ರಾಹು ಅಥವಾ ಕೇತುವನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.

nullification.sarpam.jupiter_kendra=ಗುರು ರಾಹುವಿನಿಂದ ಕೇಂದ್ರದಲ್ಲಿದ್ದಾನೆ.
nullification.sarpam.jupiter_aspect=ಗುರು ರಾಹು ಅಥವಾ ಕೇತುವನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.
nullification.sarpam.own_exalted=ರಾಹು/ಕೇತು ಸ್ವಕ್ಷೇತ್ರ ಅಥವಾ ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾರೆ.

nullification.pithru.jupiter_aspect=ಗುರು 9ನೇ ಮನೆ ಅಥವಾ ಸೂರ್ಯನನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.
nullification.pithru.own_exalted=ಸೂರ್ಯ ಸ್ವಕ್ಷೇತ್ರ ಅಥವಾ ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ.
nullification.pithru.benefic=ಶುಭ ಗ್ರಹಗಳು ಸೂರ್ಯನೊಂದಿಗೆ ಯುತಿಯಲ್ಲಿವೆ.

nullification.putra.jupiter=ಗುರು 5ನೇ ಮನೆಯಲ್ಲಿದ್ದಾನೆ ಅಥವಾ 5ನೇ ಮನೆಯನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.
nullification.putra.benefic=5ನೇ ಮನೆಯಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿವೆ.

nullification.kalathira.venus_strong=ಶುಕ್ರ ಸ್ವಕ್ಷೇತ್ರ ಅಥವಾ ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ.
nullification.kalathira.jupiter_aspect=ಗುರು 7ನೇ ಮನೆಯನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.

nullification.shani.own_exalted=ಶನಿ ಸ್ವಕ್ಷೇತ್ರ ಅಥವಾ ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ.
nullification.shani.jupiter_aspect=ಗುರು ಶನಿಯನ್ನು ವೀಕ್ಷಿಸುತ್ತಿದ್ದಾನೆ.
nullification.shani.yogakaraka=ಶನಿ ಈ ಲಗ್ನಕ್ಕೆ ಯೋಗಕಾರಕನಾಗಿದ್ದಾನೆ.
nullification.angarak.upachaya=ಉಪಚಯ ಸ್ಥಾನದಲ್ಲಿ (3/6/11) ಇರುವುದರಿಂದ ಶತ್ರು ಜಯ ಯೋಗವಾಗಿ ಪರಿವರ್ತನೆ.
nullification.bhadhakadhipati.upachaya=ಬಾಧಕಾಧಿಪತಿಯು ಉಪಚಯ ಸ್ಥಾನದಲ್ಲಿ (3/6/11) ಇರುವುದರಿಂದ ದೋಷ ನಿವೃತ್ತಿಯಾಗುತ್ತದೆ.

remedy.sevvai=ಸುಬ್ರಹ್ಮಣ್ಯ ಅಥವಾ ವೈದೀಶ್ವರನ್ ಕೋವಿಲ್ ಪೂಜೆ ಮಾಡಿ.
remedy.kalasarpa=ಶಿವ ಪೂಜೆ ಮತ್ತು ಶಿಸ್ತುಬದ್ಧ ಜೀವನ ನಡೆಸಿ.
remedy.sarpam=ರಾಹು ಕಾಲದಲ್ಲಿ ದುರ್ಗಾ ಪೂಜೆ ಮಾಡಿ.
remedy.pithru=ಪಿತೃ ತರ್ಪಣ ಮತ್ತು ಹಿರಿಯರ ಸೇವೆ ಮಾಡಿ.
remedy.putra=ಸಂತಾನ ಗೋಪಾಲ ಪೂಜೆ ಮಾಡಿ.
remedy.kalathira=ದಂಪತಿ ಪೂಜೆ ಮತ್ತು ಕಲ್ಯಾಣ ದರ್ಶನ ಮಾಡಿ.
nullification.sevvai.house_sign_exemption=ವಿಶಿಷ್ಟ ಭಾವ ಮತ್ತು ರಾಶಿ ವಿನಾಯಿತಿಯಿಂದ ಕುಜ ದೋಷ ರದ್ದಾಗುತ್ತದೆ.

yoga.gajakesari=ಗಜಕೇಸರಿ ಯೋಗ
yoga.gajakesari.desc=ಚಂದ್ರನಿಂದ ಕೇಂದ್ರದಲ್ಲಿ ಗುರು ಇದ್ದಾನೆ. ಸಂಪತ್ತು, ಬುದ್ಧಿವಂತಿಕೆ ಮತ್ತು ಸದ್ಗುಣ ನೀಡುತ್ತದೆ.
yoga.budha_aditya=ಬುಧಾದಿತ್ಯ ಯೋಗ
yoga.budha_aditya.desc=ಸೂರ್ಯ ಮತ್ತು ಬುಧ ಯುತಿ. ತೀವ್ರ ಬುದ್ಧಿವಂತಿಕೆ ಮತ್ತು ಕೀರ್ತಿ ನೀಡುತ್ತದೆ.
yoga.chandra_mangal=ಚಂದ್ರ ಮಂಗಳ ಯೋಗ
yoga.chandra_mangal.desc=ಚಂದ್ರ ಮತ್ತು ಕುಜ ಯುತಿ. ಆರ್ಥಿಕ ಪ್ರಗತಿ ನೀಡುತ್ತದೆ.
yoga.ruchaka=ರುಚಕ ಯೋಗ (ಪಂಚ ಮಹಾಪುರುಷ ಯೋಗ)
yoga.ruchaka.desc=ಕುಜ ಕೇಂದ್ರದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ನಾಯಕತ್ವ ಮತ್ತು ಶೌರ್ಯ ನೀಡುತ್ತದೆ.
yoga.bhadra=ಭದ್ರ ಯೋಗ (ಪಂಚ ಮಹಾಪುರುಷ ಯೋಗ)
yoga.bhadra.desc=ಬುಧ ಕೇಂದ್ರದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ವ್ಯಾಪಾರ ಕೌಶಲ್ಯ ಮತ್ತು ಬುದ್ಧಿವಂತಿಕೆ ನೀಡುತ್ತದೆ.
yoga.hamsa=ಹಂಸ ಯೋಗ (ಪಂಚ ಮಹಾಪುರುಷ ಯೋಗ)
yoga.hamsa.desc=ಗುರು ಕೇಂದ್ರದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ಜ್ಞಾನ ಮತ್ತು ಗೌರವ ನೀಡುತ್ತದೆ.
yoga.malavya=ಮಾಳವ್ಯ ಯೋಗ (ಪಂಚ ಮಹಾಪುರುಷ ಯೋಗ)
yoga.malavya.desc=ಶುಕ್ರ ಕೇಂದ್ರದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ಸೌಂದರ್ಯ ಮತ್ತು ಭೋಗ ಭಾಗ್ಯ ನೀಡುತ್ತದೆ.
yoga.sasa=ಶಶ ಯೋಗ (ಪಂಚ ಮಹಾಪುರುಷ ಯೋಗ)
yoga.sasa.desc=ಶನಿ ಕೇಂದ್ರದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ಅಧಿಕಾರ ಮತ್ತು ಸಹನೆ ನೀಡುತ್ತದೆ.
yoga.neechabhanga=ನೀಚಭಂಗ ರಾಜಯೋಗ
yoga.neechabhanga.desc=ನೀಚ ಗ್ರಹದ ಅಧಿಪತಿ ಕೇಂದ್ರದಲ್ಲಿದ್ದು ನೀಚಭಂಗ ರಾಜಯೋಗ ನೀಡುತ್ತದೆ.
yoga.dharma_karmadhipati=ಧರ್ಮ-ಕರ್ಮಾಧಿಪತಿ ಯೋಗ
yoga.dharma_karmadhipati.desc=9ನೇ ಮತ್ತು 10ನೇ ಅಧಿಪತಿಗಳ ಯುತಿ ಅಥವಾ ದೃಷ್ಟಿ. ಉದ್ಯೋಗ ಯಶಸ್ಸು ಮತ್ತು ಅಧಿಕಾರ ನೀಡುತ್ತದೆ.
yoga.rajayogam=ಕೇಂದ್ರ-ತ್ರಿಕೋಣ ರಾಜಯೋಗ
yoga.rajayogam.desc=ಕೇಂದ್ರ ಮತ್ತು ತ್ರಿಕೋಣ ಅಧಿಪತಿಗಳ ಯುತಿ. ಭಾಗ್ಯ ಮತ್ತು ಪ್ರಗತಿ ತರುತ್ತದೆ.
yoga.lakshmi=ಲಕ್ಷ್ಮೀ ಯೋಗ
yoga.lakshmi.desc=9ನೇ ಅಧಿಪತಿ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದು ಲಗ್ನಾಧಿಪತಿ ಬಲಿಷ್ಠನಾಗಿದ್ದಾನೆ. ಅಪಾರ ಸಂಪತ್ತು ಮತ್ತು ಗೌರವ ನೀಡುತ್ತದೆ.
yoga.amala=ಅಮಲ ಯೋಗ
yoga.amala.desc=ಲಗ್ನ ಅಥವಾ ಚಂದ್ರನಿಂದ 10ನೇ ಮನೆಯಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿದ್ದು ನಿಷ್ಕಳಂಕ ಕೀರ್ತಿ ಮತ್ತು ಉನ್ನತ ಸ್ಥಾನ ನೀಡುತ್ತದೆ.
yoga.parijata=ಪಾರಿಜಾತ ಯೋಗ
yoga.parijata.desc=ಲಗ್ನಾಧಿಪತಿಯ ಡಿಸ್ಪೋಸಿಟರ್ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದಾನೆ. ಜೀವನದ ಉತ್ತರಾರ್ಧದಲ್ಲಿ ಅಧಿಕ ಕೀರ್ತಿ ಮತ್ತು ಗೌರವ ನೀಡುತ್ತದೆ.
yoga.chatussagara=ಚತುಃಸಾಗರ ಯೋಗ
yoga.chatussagara.desc=ಎಲ್ಲಾ ನಾಲ್ಕು ಕೇಂದ್ರಗಳಲ್ಲಿ (1, 4, 7, 10) ಗ್ರಹಗಳಿರುವುದು. ಸ್ಥಿರ ವೃತ್ತಿ ಮತ್ತು ಆರ್ಥಿಕ ಭದ್ರತೆ ನೀಡುತ್ತದೆ.
yoga.mala=ಮಾಲಾ ಯೋಗ
yoga.mala.desc=ಎಲ್ಲಾ ಮೂರು ಶುಭ ಗ್ರಹಗಳು (ಗುರು, ಶುಕ್ರ, ಬುಧ) ಕೇಂದ್ರದಲ್ಲಿದ್ದು ಪಾಪ ಗ್ರಹಗಳಿಲ್ಲದಿರುವುದು. ಅಪಾರ ಸಂಪತ್ತು ಮತ್ತು ಗೌರವ ನೀಡುತ್ತದೆ.
yoga.indra=ಇಂದ್ರ ಯೋಗ
yoga.indra.desc=5 ಮತ್ತು 11ನೇ ಅಧಿಪತಿಗಳ ಪರಿವರ್ತನೆ ಅಥವಾ 11ನೇ ಅಧಿಪತಿ 5ರಲ್ಲಿದ್ದು ಚಂದ್ರ 11ರಲ್ಲಿದ್ದಾನೆ. ರಾಜಯೋಗ ಮತ್ತು ಉನ್ನತ ಪದವಿ ನೀಡುತ್ತದೆ.
yoga.kendra_trikona_sambandha=ಕೇಂದ್ರ-ತ್ರಿಕೋಣ ಸಂಬಂಧ ರಾಜಯೋಗ
yoga.kendra_trikona_sambandha.desc=ಕೇಂದ್ರ ಮತ್ತು ತ್ರಿಕೋಣ ಅಧಿಪತಿಗಳ ಯುತಿ, ದೃಷ್ಟಿ ಅಥವಾ ಪರಿವರ್ತನೆ. ಜೀವನದಲ್ಲಿ ಮಹತ್ತರ ಯಶಸ್ಸು ನೀಡುತ್ತದೆ.
yoga.bhagyalakshmi=ಭಾಗ್ಯಲಕ್ಷ್ಮೀ ಯೋಗ
yoga.bhagyalakshmi.desc=9ನೇ ಅಧಿಪತಿ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿ ಸ್ವ/ಉಚ್ಚ ರಾಶಿಯಲ್ಲಿದ್ದು ಗುರು, ಶುಕ್ರ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿದ್ದಾರೆ. ಸಕಲ ಭಾಗ್ಯ ಮತ್ತು ಸಮೃದ್ಧಿ ನೀಡುತ್ತದೆ.
yoga.rajalakshmi=ರಾಜಲಕ್ಷ್ಮೀ ಯೋಗ
yoga.rajalakshmi.desc=ಗುರು, ಶುಕ್ರ, ಬುಧ ಮತ್ತು ಚಂದ್ರ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿ ಪಾಪಗ್ರಹಗಳ ಬಾಧೆಯಿಲ್ಲದೆ ಸ್ಥಿತರಾಗಿದ್ದಾರೆ. ರಾಜಭೋಗ ಮತ್ತು ಐಶ್ವರ್ಯ ನೀಡುತ್ತದೆ.
yoga.adhi=ಅಧಿ ಯೋಗ
yoga.adhi.desc=ಚಂದ್ರ ಅಥವಾ ಲಗ್ನದಿಂದ 6, 7, 8ರಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿರುವುದು. ನಾಯಕತ್ವ ಮತ್ತು ಶತ್ರುಜಯ ನೀಡುತ್ತದೆ.
yoga.vasumathi=ವಸುಮತಿ ಯೋಗ
yoga.vasumathi.desc=ಎಲ್ಲಾ ಶುಭ ಗ್ರಹಗಳು ಉಪಚಯ (3, 6, 10, 11) ಸ್ಥಾನದಲ್ಲಿರುವುದು. ಸ್ವತಂತ್ರ ಧನಾರ್ಜನೆ ನೀಡುತ್ತದೆ.
yoga.akhanda_samrajya=ಅಖಂಡ ಸಾಮ್ರಾಜ್ಯ ಯೋಗ
yoga.akhanda_samrajya.desc=ಸ್ಥಿರ/ಚರ ಲಗ್ನದಲ್ಲಿ ಗುರು ಮತ್ತು 2/9/11ನೇ ಅಧಿಪತಿಗಳು ಕೇಂದ್ರದಲ್ಲಿದ್ದಾರೆ. ಶಾಶ್ವತ ಅಧಿಕಾರ ಮತ್ತು ಭಾಗ್ಯ ನೀಡುತ್ತದೆ.
yoga.saraswati=ಸರಸ್ವತೀ ಯೋಗ
yoga.saraswati.desc=ಗುರು, ಶುಕ್ರ, ಬುಧ ಕೇಂದ್ರ/ತ್ರಿಕೋಣ/2ನೇ ಮನೆಯಲ್ಲಿರುವುದು. ಅಗಾಧ ಜ್ಞಾನ ಮತ್ತು ವಿದ್ವತ್ತು ನೀಡುತ್ತದೆ.
yoga.kalanidhi=ಕಲಾನಿಧಿ ಯೋಗ
yoga.kalanidhi.desc=ಗುರು 2 ಅಥವಾ 5ರಲ್ಲಿ ಬುಧ ಮತ್ತು ಶುಕ್ರರಿಂದ ಯುತ/ದೃಷ್ಟವಾಗಿದೆ. ಬಹುಮುಖ ಪ್ರತಿಭೆ ನೀಡುತ್ತದೆ.
yoga.kahala=ಕಾಹಳ ಯೋಗ
yoga.kahala.desc=4 ಮತ್ತು 9ನೇ ಅಧಿಪತಿಗಳು ಪರಸ್ಪರ ಕೇಂದ್ರದಲ್ಲಿದ್ದಾರೆ. ಧೈರ್ಯ ಮತ್ತು ವಾಹನ ಸೌಖ್ಯ ನೀಡುತ್ತದೆ.
yoga.parvata=ಪರ್ವತ ಯೋಗ
yoga.parvata.desc=ಕೇಂದ್ರದಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿದ್ದು 6/8ನೇ ಮನೆಗಳಲ್ಲಿ ಪಾಪಗ್ರಹಗಳಿಲ್ಲದಿರುವುದು. ಸ್ಥಿರಾಸ್ತಿ ಮತ್ತು ಕೀರ್ತಿ ನೀಡುತ್ತದೆ.
yoga.pushkala=ಪುಷ್ಕಲ ಯೋಗ
yoga.pushkala.desc=ಚಂದ್ರನ ಡಿಸ್ಪೋಸಿಟರ್ ಲಗ್ನಾಧಿಪತಿಯೊಂದಿಗೆ ಕೇಂದ್ರ/ತ್ರಿಕೋಣದಲ್ಲಿದ್ದು ಲಗ್ನವನ್ನು ನೋಡುತ್ತದೆ. ಆಕರ್ಷಕ ವ್ಯಕ್ತಿತ್ವ ನೀಡುತ್ತದೆ.
yoga.shakata=ಶಕಟ ಯೋಗ
yoga.shakata.desc=ಗುರುವಿನಿಂದ 6/8/12ರಲ್ಲಿ ಚಂದ್ರನಿದ್ದು ಜೀವನದಲ್ಲಿ ಏರಿಳಿತಗಳನ್ನು ತರುತ್ತದೆ.
yoga.shubhakarthari=ಶುಭಕರ್ತರಿ ಯೋಗ
yoga.shubhakarthari.desc=ಲಗ್ನ, ಚಂದ್ರ ಅಥವಾ 10ನೇ ಮನೆಯ ಎರಡೂ ಬದಿಗಳಲ್ಲಿ (2 ಮತ್ತು 12) ಶುಭ ಗ್ರಹಗಳಿರುವುದು. ರಕ್ಷಣೆ ನೀಡುತ್ತದೆ.
yoga.mahabhagya=ಮಹಾಭಾಗ್ಯ ಯೋಗ
yoga.mahabhagya.desc=ದಿನ/ರಾತ್ರಿ ಜನನ ಮತ್ತು ಲಗ್ನ/ಸೂರ್ಯ/ಚಂದ್ರರ ಸ್ಥಿತಿಯಿಂದ ಜೀವಮಾನದ ಅದೃಷ್ಟ ನೀಡುತ್ತದೆ.
yoga.chamara=ಚಾಮರ ಯೋಗ
yoga.chamara.desc=ಉಚ್ಚ ಲಗ್ನಾಧಿಪತಿ ಕೇಂದ್ರದಲ್ಲಿದ್ದು ಗುರುವಿನ ದೃಷ್ಟಿ ಹೊಂದಿದೆ. ದೀರ್ಘಾಯುಷ್ಯ ಮತ್ತು ಗೌರವ ನೀಡುತ್ತದೆ.
yoga.vesi=ವೇಸಿ ಯೋಗ
yoga.vesi.desc=ಸೂರ್ಯನಿಂದ 2ರಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿರುವುದು. ಮಾತುಗಾರಿಕೆ ಮತ್ತು ಸಮೃದ್ಧಿ ನೀಡುತ್ತದೆ.
yoga.vosi=ವೋಸಿ ಯೋಗ
yoga.vosi.desc=ಸೂರ್ಯನಿಂದ 12ರಲ್ಲಿ ಶುಭ ಗ್ರಹಗಳಿರುವುದು. ಆಧ್ಯಾತ್ಮಿಕತೆ ಮತ್ತು ಕೀರ್ತಿ ನೀಡುತ್ತದೆ.
yoga.obhayachari=ಉಭಯಚಾರಿ ಯೋಗ
yoga.obhayachari.desc=ಸೂರ್ಯನ ಎರಡೂ ಬದಿಯಲ್ಲಿ (2 ಮತ್ತು 12) ಶುಭ ಗ್ರಹಗಳಿರುವುದು. ಸ್ಥಿರತೆ ನೀಡುತ್ತದೆ.
yoga.sunapha=ಸುನಫಾ ಯೋಗ
yoga.sunapha.desc=ಚಂದ್ರನಿಂದ 2ರಲ್ಲಿ ಗ್ರಹಗಳಿರುವುದು. ಬುದ್ಧಿವಂತಿಕೆ ಮತ್ತು ಆಸ್ತಿ ನೀಡುತ್ತದೆ.
yoga.anapha=ಅನಫಾ ಯೋಗ
yoga.anapha.desc=ಚಂದ್ರನಿಂದ 12ರಲ್ಲಿ ಗ್ರಹಗಳಿರುವುದು. ಸದ್ಗುಣ ಮತ್ತು ಆರೋಗ್ಯ ನೀಡುತ್ತದೆ.
yoga.dhurudhura=ಧುರುಧುರಾ ಯೋಗ
yoga.dhurudhura.desc=ಚಂದ್ರನ ಎರಡೂ ಬದಿಯಲ್ಲಿ (2 ಮತ್ತು 12) ಗ್ರಹಗಳಿರುವುದು. ಅಪಾರ ಸಂಪತ್ತು ನೀಡುತ್ತದೆ.
yoga.kemadruma=ಕೇಮದ್ರುಮ ಯೋಗ
yoga.kemadruma.desc=ಚಂದ್ರನ 2 ಮತ್ತು 12ರಲ್ಲಿ ಗ್ರಹಗಳಿಲ್ಲದಿರುವುದು. ಭಂಗವಾದಾಗ ದೋಷ ನಿವಾರಣೆಯಾಗುತ್ತದೆ.
yoga.pravrajya=ಪ್ರವ್ರಜ್ಯಾ ಯೋಗ
yoga.pravrajya.desc=ಒಂದೇ ಮನೆಯಲ್ಲಿ 4 ಅಥವಾ ಹೆಚ್ಚು ಗ್ರಹಗಳಿರುವುದು. ಆಧ್ಯಾತ್ಮಿಕ ಚಿಂತನೆ ನೀಡುತ್ತದೆ.
yoga.vipareeta=ವಿಪರೀತ ರಾಜಯೋಗ
yoga.vipareeta.desc=6, 8, 12ನೇ ಅಧಿಪತಿಗಳು ತ್ರಿಕ ಸ್ಥಾನದಲ್ಲಿದ್ದು ಅನಿರೀಕ್ಷಿತ ಯಶಸ್ಸು ನೀಡುತ್ತಾರೆ.

