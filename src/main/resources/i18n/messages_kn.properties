dosham.sarpa=ಸರ್ಪ ದೋಷ
remedy.sarpa=ನಾಗ ದೇವರಿಗೆ ಹಾಲಿನ ಅಭಿಷೇಕ ಮಾಡಿ ರಾಹು-ಕೇತು ಶಾಂತಿ ಮಾಡಿಸಿ.
