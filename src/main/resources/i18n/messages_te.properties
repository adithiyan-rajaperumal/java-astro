nullification.sevvai.own_exalted=కుజుడు స్వక్షేత్రం లేదా ఉచ్ఛ రాశిలో ఉన్నాడు.
nullification.sevvai.jupiter_aspect=గురుడు కుజుడిని చూస్తున్నాడు లేదా కలసి ఉన్నాడు.
nullification.sevvai.venus_aspect=శుక్రుడు కుజుడిని చూస్తున్నాడు.
nullification.sevvai.benefic_sign=1 లేదా 2వ ఇంట శుభ రాశిలో కుజుడు ఉన్నాడు.

nullification.kalasarpa.conjunct=ఒక గ్రహం రాహువు లేదా కేతువుతో కలసి ఉంది.
nullification.kalasarpa.jupiter_aspect=గురుడు రాహువు లేదా కేతువును చూస్తున్నాడు.

nullification.sarpam.jupiter_kendra=గురుడు రాహువు నుండి కేంద్రంలో ఉన్నాడు.
nullification.sarpam.jupiter_aspect=గురుడు రాహువు లేదా కేతువును చూస్తున్నాడు.
nullification.sarpam.own_exalted=రాహు/కేతువులు స్వక్షేత్రం లేదా ఉచ్ఛ రాశిలో ఉన్నారు.

nullification.pithru.jupiter_aspect=గురుడు 9వ ఇల్లు లేదా సూర్యుడిని చూస్తున్నాడు.
nullification.pithru.own_exalted=సూర్యుడు స్వక్షేత్రం లేదా ఉచ్ఛ రాశిలో ఉన్నాడు.
nullification.pithru.benefic=శుభ గ్రహాలు సూర్యుడితో కలసి ఉన్నాయి.

nullification.putra.jupiter=గురుడు 5వ ఇంట ఉన్నాడు లేదా 5వ ఇంటిని చూస్తున్నాడు.
nullification.putra.benefic=5వ ఇంట శుభ గ్రహాలు ఉన్నాయి.

nullification.kalathira.venus_strong=శుక్రుడు స్వక్షేత్రం లేదా ఉచ్ఛ రాశిలో ఉన్నాడు.
nullification.kalathira.jupiter_aspect=గురుడు 7వ ఇంటిని చూస్తున్నాడు.

nullification.shani.own_exalted=శని స్వక్షేత్రం లేదా ఉచ్ఛ రాశిలో ఉన్నాడు.
nullification.shani.jupiter_aspect=గురుడు శనిని చూస్తున్నాడు.
nullification.shani.yogakaraka=శని ఈ లగ్నానికి యోగకారకుడు.
nullification.angarak.upachaya=ఉపచయ స్థానంలో (3/6/11) ఉండటం వలన శత్రు జయ యోగంగా మారింది.
nullification.bhadhakadhipati.upachaya=బాధకాధిపతి ఉపచయ స్థానంలో (3/6/11) ఉండి దోష నివృత్తి చేస్తుంది.

remedy.sevvai=సుబ్రహ్మణ్య స్వామి లేదా వైదీశ్వరన్ కోవిల్ పూజ చేయండి.
remedy.kalasarpa=శివ ఆరాధన మరియు నియమబద్ధ జీవితం గడపండి.
remedy.sarpam=రాహు కాలంలో దుర్గా పూజ చేయండి.
remedy.pithru=పితృ తర్పణాలు మరియు దానాలు చేయండి.
remedy.putra=సంతాన గోపాల పూజ చేయండి.
remedy.kalathira=దంపతుల పూజ మరియు కళ్యాణ దర్శనం చేసుకోండి.
nullification.sevvai.house_sign_exemption=ప్రత్యేక స్థానం మరియు రాశి మినహాయింపు వలన కుజ దోష నివృత్తి అవుతుంది.

yoga.gajakesari=గజకేసరి యోగం
yoga.gajakesari.desc=చంద్రుని నుండి కేంద్రంలో గురుడు ఉన్నాడు. సంపద, బుద్ధిమత్తత మరియు మంచి పేరు ఇస్తుంది.
yoga.budha_aditya=బుధాదిత్య యోగం
yoga.budha_aditya.desc=సూర్యుడు మరియు బుధుల యుతి. తీవ్రమైన బుద్ధి మరియు కీర్తి ఇస్తుంది.
yoga.chandra_mangal=చంద్ర మంగళ యోగం
yoga.chandra_mangal.desc=చంద్రుడు మరియు కుజుల యుతి. ఆర్థికాభివృద్ధి మరియు ధన లాభం ఇస్తుంది.
yoga.ruchaka=రుచక యోగం (పంచ మహాపురుష యోగం)
yoga.ruchaka.desc=కుజుడు కేంద్రంలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. నాయకత్వం మరియు శౌర్యం ఇస్తుంది.
yoga.bhadra=భద్ర యోగం (పంచ మహాపురుష యోగం)
yoga.bhadra.desc=బుధుడు కేంద్రంలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. వ్యాపార నైపుణ్యం మరియు తెలివితేటలు ఇస్తుంది.
yoga.hamsa=హంస యోగం (పంచ మహాపురుష యోగం)
yoga.hamsa.desc=గురుడు కేంద్రంలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. జ్ఞానం మరియు గౌరవం ఇస్తుంది.
yoga.malavya=మాళవ్య యోగం (పంచ మహాపురుష యోగం)
yoga.malavya.desc=శుక్రుడు కేంద్రంలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. సౌందర్యం మరియు సుఖ భోగాలు ఇస్తుంది.
yoga.sasa=శశ యోగం (పంచ మహాపురుష యోగం)
yoga.sasa.desc=శని కేంద్రంలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. అధికారం మరియు సహనం ఇస్తుంది.
yoga.neechabhanga=నీచభంగ రాజయోగం
yoga.neechabhanga.desc=నీచ గ్రహం యొక్క రాశ్యాధిపతి కేంద్రంలో ఉండటం వల్ల నీచభంగ రాజయోగం ఏర్పడుతుంది.
yoga.dharma_karmadhipati=ధర్మ-కర్మాధిపతి యోగం
yoga.dharma_karmadhipati.desc=9వ మరియు 10వ అధిపతుల యుతి లేదా దృష్టి. గొప్ప వృత్తిపరమైన విజయాన్ని ఇస్తుంది.
yoga.rajayogam=కేంద్ర-త్రికోణ రాజయోగం
yoga.rajayogam.desc=కేంద్ర మరియు త్రికోణ అధిపతుల యుతి. సంపద మరియు గొప్ప కీర్తిని ఇస్తుంది.
yoga.lakshmi=లక్ష్మీ యోగం
yoga.lakshmi.desc=9వ అధిపతి కేంద్ర/త్రికోణాలలో స్వ/ఉచ్ఛ రాశిలో ఉండి లగ్నాధిపతి బలవంతుడిగా ఉన్నాడు. అపార సంపద మరియు భాగ్యాలు ఇస్తుంది.
yoga.amala=అమల యోగం
yoga.amala.desc=లగ్నం లేదా చంద్రుని నుండి 10వ స్థానంలో శుభ గ్రహాలు ఉండి ఉన్నత కీర్తి మరియు పదవిని ఇస్తుంది.
yoga.parijata=పారిజాత యోగం
yoga.parijata.desc=లగ్నాధిపతి యొక్క డిస్పోజిటర్ కేంద్ర/త్రికోణాలలో స్వ/ఉచ్ఛ రాశిలో ఉన్నాడు. జీవిత ద్వితీయార్థంలో గొప్ప కీర్తి మరియు గౌరవం ఇస్తుంది.
yoga.chatussagara=చతుఃసాగర యోగం
yoga.chatussagara.desc=అన్ని నాలుగు కేంద్రాలలో (1, 4, 7, 10) గ్రహాలు ఉండటం. స్థిరమైన వృత్తి మరియు ఆర్థిక భద్రత ఇస్తుంది.
yoga.mala=మాలా యోగం
yoga.mala.desc=అన్ని మూడు శుభ గ్రహాలు (గురు, శుక్ర, బుధ) కేంద్రాలలో ఉండి పాప గ్రహాలు లేకుండా ఉండటం. అపారమైన సంపద మరియు గౌరవం ఇస్తుంది.
yoga.indra=ఇంద్ర యోగం
yoga.indra.desc=5 మరియు 11వ అధిపతుల పరివర్తన లేదా 11వ అధిపతి 5లో ఉండి చంద్రుడు 11లో ఉండటం. రాజయోగం మరియు ఉన్నత పదవులను ఇస్తుంది.
yoga.kendra_trikona_sambandha=కేంద్ర-త్రికోణ సంబంధ రాజయోగం
yoga.kendra_trikona_sambandha.desc=కేంద్ర మరియు త్రికోణ అధిపతుల యుతి, దృష్టి లేదా పరివర్తన. జీవితంలో గొప్ప విజయాన్ని ఇస్తుంది.
yoga.bhagyalakshmi=భాగ్యలక్ష్మీ యోగం
yoga.bhagyalakshmi.desc=9వ అధిపతి కేంద్ర/త్రికోణాలలో స్వ/ఉచ్ఛ రాశిలో ఉండి గురు, శుక్రులు కేంద్ర/త్రికోణాలలో ఉన్నారు. సకల భాగ్యాలు మరియు సంపదను ఇస్తుంది.
yoga.rajalakshmi=రాజలక్ష్మీ యోగం
yoga.rajalakshmi.desc=గురు, శుక్ర, బుధ, చంద్రులు పాపగ్రహాల ప్రభావం లేకుండా కేంద్ర/త్రికోణాలలో ఉన్నారు. రాజభోగం మరియు వైభవాన్ని ఇస్తుంది.
yoga.adhi=అధి యోగం
yoga.adhi.desc=చంద్రుడు లేదా లగ్నం నుండి 6, 7, 8లలో శుభ గ్రహాలు ఉండటం. నాయకత్వ లక్షణాలు మరియు శత్రుజయం ఇస్తుంది.
yoga.vasumathi=వసుమతి యోగం
yoga.vasumathi.desc=అన్ని శుభ గ్రహాలు ఉపచయ (3, 6, 10, 11) స్థానాలలో ఉండటం. స్వతంత్ర ధనార్జన మరియు సంపద ఇస్తుంది.
yoga.akhanda_samrajya=అఖండ సామ్రాజ్య యోగం
yoga.akhanda_samrajya.desc=స్థిర/చర లగ్నాలలో గురుడు మరియు 2/9/11వ అధిపతులు కేంద్రంలో ఉన్నారు. శాశ్వత అధికారం మరియు సంపద ఇస్తుంది.
yoga.saraswati=సరస్వతీ యోగం
yoga.saraswati.desc=గురు, శుక్ర, బుధులు కేంద్ర/త్రికోణ/2వ స్థానంలో ఉన్నారు. అపార జ్ఞానం మరియు విద్వత్తు ఇస్తుంది.
yoga.kalanidhi=కళానిధి యోగం
yoga.kalanidhi.desc=గురుడు 2 లేదా 5లో బుధ, శుక్రుల కలయిక లేదా దృష్టితో ఉన్నాడు. బహుముఖ ప్రజ్ఞాపాటవాలు ఇస్తుంది.
yoga.kahala=కాహళ యోగం
yoga.kahala.desc=4 మరియు 9వ అధిపతులు పరస్పర కేంద్రాలలో ఉన్నారు. ధైర్యం మరియు వాహన సౌఖ్యం ఇస్తుంది.
yoga.parvata=పర్వత యోగం
yoga.parvata.desc=కేంద్రాలలో శుభ గ్రహాలు ఉండి 6/8 స్థానాలలో పాపగ్రహాలు లేకపోవడం. స్థిరాస్తులు మరియు కీర్తి ఇస్తుంది.
yoga.pushkala=పుష్కల యోగం
yoga.pushkala.desc=చంద్రుని డిస్పోజిటర్ లగ్నాధిపతితో కలిసి కేంద్ర/త్రికోణాలలో ఉండి లగ్నాన్ని చూస్తున్నాడు. ఆకర్షణీయమైన వ్యక్తిత్వం ఇస్తుంది.
yoga.shakata=శకట యోగం
yoga.shakata.desc=గురుడు నుండి 6/8/12లో చంద్రుడు ఉండటం వల్ల జీవితంలో హెచ్చుతగ్గులు వస్తాయి.
yoga.shubhakarthari=శుభకర్తరి యోగం
yoga.shubhakarthari.desc=లగ్నం, చంద్రుడు లేదా 10వ స్థానానికి ఇరువైపులా (2 మరియు 12) శుభ గ్రహాలు ఉండటం. రక్షణ మరియు అభివృద్ధి ఇస్తుంది.
yoga.mahabhagya=మహాభాగ్య యోగం
yoga.mahabhagya.desc=పగలు/రాత్రి జననం మరియు లగ్న/సూర్య/చంద్రుల స్థితుల వల్ల జీవితాంతం అదృష్టం ఉంటుంది.
yoga.chamara=చామర యోగం
yoga.chamara.desc=ఉచ్ఛ లగ్నాధిపతి కేంద్రంలో ఉండి గురు దృష్టిని కలిగి ఉన్నాడు. దీర్ఘాయుష్షు మరియు గౌరవం ఇస్తుంది.
yoga.vesi=వేసి యోగం
yoga.vesi.desc=సూర్యుని నుండి 2వ ఇంట్లో శుభ గ్రహాలు ఉండటం. వాక్చాతుర్యం మరియు సంపద ఇస్తుంది.
yoga.vosi=వోసి యోగం
yoga.vosi.desc=సూర్యుని నుండి 12వ ఇంట్లో శుభ గ్రహాలు ఉండటం. ఆధ్యాత్మికత మరియు కీర్తి ఇస్తుంది.
yoga.obhayachari=ఉభయచారి యోగం
yoga.obhayachari.desc=సూర్యుని ఇరువైపులా (2 మరియు 12) శుభ గ్రహాలు ఉండటం. స్థిరత్వం ఇస్తుంది.
yoga.sunapha=సునఫా యోగం
yoga.sunapha.desc=చంద్రుని నుండి 2వ ఇంట్లో గ్రహాలు ఉండటం. బుద్ధికుశలత మరియు ఆస్తి ఇస్తుంది.
yoga.anapha=అనఫా యోగం
yoga.anapha.desc=చంద్రుని నుండి 12వ ఇంట్లో గ్రహాలు ఉండటం. సదాచారం మరియు ఆరోగ్యం ఇస్తుంది.
yoga.dhurudhura=ధురుధురా యోగం
yoga.dhurudhura.desc=చంద్రుని ఇరువైపులా (2 మరియు 12) గ్రహాలు ఉండటం. అపార సంపద ఇస్తుంది.
yoga.kemadruma=కేమద్రుమ యోగం
yoga.kemadruma.desc=చంద్రునికి 2 మరియు 12లలో గ్రహాలు లేకపోవడం. భంగమైనప్పుడు దోషం తొలగిపోతుంది.
yoga.pravrajya=ప్రవ్రజ్యా యోగం
yoga.pravrajya.desc=ఒకే ఇంట్లో 4 లేదా అంతకంటే ఎక్కువ గ్రహాలు ఉండటం. ఆధ్యాత్మిక దృష్టిని ఇస్తుంది.
yoga.vipareeta=విపరీత రాజయోగం
yoga.vipareeta.desc=6, 8, 12వ అధిపతులు త్రిక స్థానాలలో ఉండి ఆకస్మిక విజయాన్ని ఇస్తారు.

