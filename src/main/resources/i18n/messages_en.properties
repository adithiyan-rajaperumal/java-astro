yoga.gajakesari=Gajakesari Yoga
yoga.gajakesari.desc=Jupiter is in Kendra from Moon. Brings wealth, intelligence, and virtue.
yoga.budha_aditya=Budha-Aditya Yoga
yoga.budha_aditya.desc=Sun and Mercury are conjunct. Brings high intelligence, fame, and communication skills.
yoga.chandra_mangal=Chandra-Mangala Yoga
yoga.chandra_mangal.desc=Moon and Mars are conjunct. Brings financial prosperity but can cause emotional volatility.
yoga.ruchaka=Ruchaka Yoga
yoga.ruchaka.desc=Mars in Kendra and in own/exalted sign. Bestows courage, leadership, and physical strength.
yoga.bhadra=Bhadra Yoga
yoga.bhadra.desc=Mercury in Kendra and in own/exalted sign. Grants high intellect, business acumen, and longevity.
yoga.hamsa=Hamsa Yoga
yoga.hamsa.desc=Jupiter in Kendra and in own/exalted sign. Gives wisdom, religious inclination, and respect.
yoga.malavya=Malavya Yoga
yoga.malavya.desc=Venus in Kendra and in own/exalted sign. Brings luxury, artistic talents, and attractiveness.
yoga.neechabhanga=Neechabhanga Raja Yoga
yoga.neechabhanga.desc=Debilitated planet's dispositor is in Kendra, nullifying debilitation into a powerful Rajayoga.
yoga.dharma_karmadhipati=Dharma-Karmadhipati Yoga
yoga.dharma_karmadhipati.desc=Conjunction or mutual aspect of 9th lord (Dharma) and 10th lord (Karma). Brings professional success and honor.
yoga.rajayogam=Kendra-Trikona Rajayoga
yoga.rajayogam.desc=Conjunction of a Kendra lord and Trikona lord, bestowing status, fortune, and rise in life.
yoga.vipareeta=Vipareeta Rajayoga
yoga.vipareeta.desc=Lords of Dusthana houses (6, 8, 12) placed in Dusthana houses, granting unexpected triumph and prosperity.
yoga.lakshmi=Lakshmi Yoga
yoga.lakshmi.desc=9th Lord in Kendra/Trikona in Own/Exalted sign with strong Lagna Lord. Bestows vast wealth, fortune, and noble character.
yoga.amala=Amala Yoga
yoga.amala.desc=Natural benefic in the 10th house from Lagna or Moon without malefic affliction. Bestows spotless reputation and professional honor.
yoga.vesi=Vesi Yoga
yoga.vesi.desc=Benefics placed in the 2nd house from Sun. Grants balanced speech, wealth, and recognition.
yoga.vosi=Vosi Yoga
yoga.vosi.desc=Benefics placed in the 12th house from Sun. Grants charitable nature, spiritual wisdom, and fame.
yoga.obhayachari=Obhayachari Yoga
yoga.obhayachari.desc=Benefics placed in both 2nd and 12th houses from Sun. Grants all-round success, high status, and prosperity.
yoga.sunapha=Sunapha Yoga
yoga.sunapha.desc=Planets placed in the 2nd house from Moon. Grants self-earned wealth, intelligence, and prosperity.
yoga.anapha=Anapha Yoga
yoga.anapha.desc=Planets placed in the 12th house from Moon. Grants good health, generosity, and peace of mind.
yoga.dhurudhura=Dhurudhura Yoga
yoga.dhurudhura.desc=Planets placed in both 2nd and 12th houses from Moon. Grants immense wealth, comforts, and leadership.
yoga.kemadruma=Kemadruma Yoga
yoga.kemadruma.desc=Moon isolated without planets in 2nd or 12th. Causes mental restlessness unless cancelled by Kemadruma Bhanga.
yoga.pravrajya=Pravrajya / Sanyasa Yoga
yoga.pravrajya.desc=Conjunction of 4 or more planets in a single house, creating deep philosophical focus or singular subject mastery.
yoga.maha_parivartana=Maha Parivartana Yoga
yoga.maha_parivartana.desc=Auspicious mutual exchange of houses between Kendra and Trikona lords, bestowing royal status and wealth.
yoga.khala_parivartana=Khala Parivartana Yoga
yoga.khala_parivartana.desc=Exchange of houses involving the 3rd Lord, creating alternating periods of struggle and breakthrough success.
yoga.dainya_parivartana=Dainya Parivartana Yoga
yoga.dainya_parivartana.desc=Exchange of houses involving Dusthana Lords (6th, 8th, 12th), creating life challenges that require spiritual resilience.
yoga.bhagyalakshmi=Bhagyalakshmi Yoga
yoga.bhagyalakshmi.desc=9th Lord in Kendra/Trikona in Own/Exalted sign with Jupiter & Venus in Kendra/Trikona. Grants supreme fortune, wealth, and spiritual grace.
yoga.rajalakshmi=Rajalakshmi Yoga
yoga.rajalakshmi.desc=Jupiter, Venus, Mercury, and Moon all well-placed in Kendra/Trikona without malefic affliction. Grants royal fortune and prosperity.
yoga.adhi=Adhi Yoga
yoga.adhi.desc=Benefics in 6th, 7th, and 8th from Moon or Lagna. Grants leadership, wealth, and dominance over adversaries.
yoga.vasumathi=Vasumathi Yoga
yoga.vasumathi.desc=All natural benefics in Upachaya houses (3, 6, 10, 11). Bestows independent wealth accumulation and financial freedom.
yoga.akhanda_samrajya=Akhanda Samrajya Yoga
yoga.akhanda_samrajya.desc=Powerful Jupiter and 2nd/9th/11th lords in Kendras for movable/fixed Lagna. Bestows lasting authority and prosperity.
yoga.saraswati=Saraswati Yoga
yoga.saraswati.desc=Jupiter, Venus, and Mercury in Kendra/Trikona/2nd with dignified Jupiter. Grants supreme wisdom, eloquence, and artistic mastery.
yoga.kalanidhi=Kalanidhi Yoga
yoga.kalanidhi.desc=Jupiter in 2nd or 5th conjunct/aspected by Mercury and Venus. Grants high expertise, multifaceted talents, and virtuous renown.
yoga.kahala=Kahala Yoga
yoga.kahala.desc=4th and 9th lords in mutual Kendras with strong Lagna Lord. Bestows courage, vehicle ownership, and executive leadership.
yoga.parvata=Parvata Yoga
yoga.parvata.desc=Benefics in Kendras with Dusthanas vacant or strictly benefic. Grants lasting legacy, property, and noble stature.
yoga.pushkala=Pushkala Yoga
yoga.pushkala.desc=Moon dispositor conjunct Lagna Lord in Kendra/Trikona and aspecting Lagna. Grants eloquence, fame, and magnetic personality.
yoga.shakata=Shakata Yoga
yoga.shakata.desc=Moon in 6/8/12 from Jupiter, causing fluctuating fortunes unless cancelled by Shakata Bhanga.
yoga.shubhakarthari=Shubhakarthari Yoga
yoga.shubhakarthari.desc=Benefics in 2nd and 12th houses from Lagna, Moon, or 10th. Protects and elevates life prospects.
yoga.mahabhagya=Mahabhagya Yoga
yoga.mahabhagya.desc=Rare gender-luminary harmony based on day/night birth and sign polarity. Grants extraordinary lifelong fortune and fame.
yoga.chamara=Chamara Yoga
yoga.chamara.desc=Exalted Lagna Lord in Kendra with Jupiter's aspect or benefics in 7/9/10. Bestows authority, longevity, and high honor.
yoga.parijata=Parijata Yoga
yoga.parijata.desc=Lagna Lord dispositor and that dispositor's ruler placed in Kendra/Trikona in Own/Exalted signs. Bestows middle/later life rise, lasting fame, and high social respect.
yoga.chatussagara=Chatussagara Yoga (4-Ocean Protection)
yoga.chatussagara.desc=All four Kendra houses (1st, 4th, 7th, 10th from Lagna) occupied by planets. Bestows unshakeable career stability, high reputation, and lifelong financial security.
yoga.mala=Mala Yoga (Garland of Benefics)
yoga.mala.desc=All three natural benefics (Jupiter, Venus, Mercury) occupy Kendra houses without any natural malefics in Kendras. Grants immense prosperity, virtues, and universal respect.
yoga.indra=Indra Yoga
yoga.indra.desc=5th and 11th lords in mutual Parivartana exchange or 11th lord in 5th with Moon in 11th. Bestows royal status, high administrative prowess, and grand honors.
yoga.kendra_trikona_sambandha=Kendra-Trikona Sambandha Yoga
yoga.kendra_trikona_sambandha.desc=Auspicious conjunction, mutual aspect, or exchange between Kendra and Trikona lords in Kendra or Trikona houses. Bestows powerful Raja Yoga breakthroughs and prosperity.

