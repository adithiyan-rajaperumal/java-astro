remedy.angarak=Worship Lord Muruga / Subramanya and offer prayers on Tuesdays.
dosham.punarphoo=Punarphoo Dosham (Vish Dosha)
remedy.punarphoo=Perform Jalabhishekam for Shivling on Mondays and chant Mahamrityunjaya Mantra.
dosham.papakarthari=Papakarthari Dosham
remedy.papakarthari=Chant Gayatri Mantra and perform Navagraha Pradakshina.
dosham.grahan=Grahan Dosham (Eclipse Affliction)
remedy.grahan=Perform Shiva Abhishekam and chant Surya/Chandra Gayatri mantras.
dosham.daridra=Daridra Yoga (Financial Leakage)
remedy.daridra=Perform Lakshmi Kubera Puja and offer donations on Fridays.
dosham.duryoga=Duryoga (Career Obstacles)
remedy.duryoga=Offer prayers to Lord Ganesha and perform daily Surya Namaskar.
dosham.sarpa=Sarpa Dosha (Kendra Malefic Enclosure)
remedy.sarpa=Perform Sarpa Shanti or offer prayers at Rahu-Ketu temples.
dosham.kendra_adhipatya=Kendra-Adhipatya Dosham (Quadrangular Ownership Affliction)
remedy.kendra_adhipatya=Offer prayers to Lord Shiva and Sri Dakshinamurthy on Thursdays and perform Navagraha Pradakshina.
dosham.bhadhakadhipati=Bhadhakadhipati Dosham (Obstacle Lord Affliction)
remedy.bhadhakadhipati=Perform worship to your Ishta Devata / Kula Devata and offer oil lamps at temple on Saturdays.
dosham.gandanta=Gandanta Dosham (Junction Affliction)
remedy.gandanta=Perform Gandanta Nakshatra Shanti, chant Mahamrityunjaya Mantra, and offer food donations.

