nullification.sevvai.own_exalted=செவ்வாய் ஆட்சி அல்லது உச்ச ராசியில் உள்ளார்.
nullification.sevvai.jupiter_aspect=குரு செவ்வாயைப் பார்க்கிறார் அல்லது சேர்க்கை பெற்றுள்ளார்.
nullification.sevvai.venus_aspect=சுக்கிரன் செவ்வாயைப் பார்க்கிறார்.
nullification.sevvai.benefic_sign=1 அல்லது 2-ம் வீட்டில் சுப ராசியில் (கடகம், தனுசு, மீனம்) செவ்வாய் உள்ளார்.

nullification.kalasarpa.conjunct=ஒரு கிரகம் ராகு அல்லது கேதுவுடன் சேர்க்கை பெற்றுள்ளது.
nullification.kalasarpa.jupiter_aspect=குரு ராகு அல்லது கேதுவைப் பார்க்கிறார்.

nullification.sarpam.jupiter_kendra=குரு ராகுவிற்கு கேந்திரத்தில் உள்ளார்.
nullification.sarpam.jupiter_aspect=குரு ராகு அல்லது கேதுவைப் பார்க்கிறார்.
nullification.sarpam.own_exalted=ராகு/கேது ஆட்சி அல்லது உச்ச ராசியில் உள்ளனர்.

nullification.pithru.jupiter_aspect=குரு 9-ம் வீட்டை அல்லது சூரியனைப் பார்க்கிறார்.
nullification.pithru.own_exalted=சூரியன் ஆட்சி அல்லது உச்ச ராசியில் உள்ளார்.
nullification.pithru.benefic=சுப கிரகங்கள் (சுக்கிரன், புதன்) சூரியனுடன் சேர்க்கை பெற்றுள்ளன.

nullification.putra.jupiter=குரு 5-ம் வீட்டில் உள்ளார் அல்லது 5-ம் வீட்டைப் பார்க்கிறார்.
nullification.putra.benefic=சுப கிரகங்கள் 5-ம் வீட்டில் உள்ளன.

nullification.kalathira.venus_strong=சுக்கிரன் ஆட்சி அல்லது உச்ச ராசியில் உள்ளார்.
nullification.kalathira.jupiter_aspect=குரு 7-ம் வீட்டைப் பார்க்கிறார்.

nullification.shani.own_exalted=சனி பகவான் ஆட்சி அல்லது உச்சம் பெற்றுள்ளார்.
nullification.shani.jupiter_aspect=குரு பகவானின் பார்வை சனி மீது பதிகிறது.
nullification.shani.yogakaraka=சனி இந்த லக்னத்திற்கு யோகாதிபதி ஆவார்.
nullification.angarak.upachaya=உபசய ஸ்தானத்தில் (3/6/11) அமைந்ததால் சத்ரு ஜெய யோகமாக மாற்றம்.
nullification.bhadhakadhipati.upachaya=பாதகாதிபதி உபசய ஸ்தானத்தில் (3/6/11) அமர்ந்து தோஷ நிவர்த்தி ஆகிறது.

remedy.sevvai=வைத்தீஸ்வரன் கோவில் வழிபாடு செய்யவும்.
remedy.kalasarpa=பொறுமை மற்றும் ஒழுக்கமான வழிபாடுகளை மேற்கொள்ளவும்.
remedy.sarpam=ராகு காலத்தில் துர்க்கை அம்மனை வழிபடவும்.
remedy.pithru=முன்னோர்களுக்கு தர்ப்பணம் மற்றும் வழிபாடு செய்யவும்.
remedy.putra=சந்தான கோபால மந்திரம் ஜபிக்கவும்.
remedy.kalathira=சுமங்கலி வழிபாடு மற்றும் திருக்கல்யாணம் தரிசனம் செய்யவும்.
remedy.shani=சனிக்கிழமைகளில் நல்லெண்ணெய் தீபம் ஏற்றவும்.

nullification.sevvai.house_sign_exemption=குறிப்பிட்ட வீடு மற்றும் ராசி விதிவிலக்கு காரணமாக செவ்வாய் தோஷம் நிவர்த்தி ஆகிறது.

yoga.gajakesari=கஜகேசரி யோகம்
yoga.gajakesari.desc=சந்திரனுக்கு கேந்திரத்தில் குரு உள்ளார். செல்வம், அறிவு மற்றும் நற்பண்புகளைத் தரும்.
yoga.budha_aditya=புதாதித்ய யோகம்
yoga.budha_aditya.desc=சூரியனும் புதனும் சேர்க்கை பெற்றுள்ளனர். கூர்மையான அறிவு, புகழ் மற்றும் உரையாடல் திறனைத் தரும்.
yoga.chandra_mangal=சந்திர மங்கள யோகம்
yoga.chandra_mangal.desc=சந்திரனும் செவ்வாயும் சேர்க்கை பெற்றுள்ளனர். பொருளாதார வளர்ச்சியைத் தரும்.
yoga.ruchaka=ருசக யோகம் (பஞ்ச மகாபுருஷ யோகம்)
yoga.ruchaka.desc=செவ்வாய் கேந்திரத்தில் ஆட்சி/உச்சம் பெற்றுள்ளார். தைரியம், தலைமைத்துவம் மற்றும் பலம் தரும்.
yoga.bhadra=பத்ர யோகம் (பஞ்ச மகாபுருஷ யோகம்)
yoga.bhadra.desc=புதன் கேந்திரத்தில் ஆட்சி/உச்சம் பெற்றுள்ளார். புத்தி கூர்மை மற்றும் வியாபார வெற்றி தரும்.
yoga.hamsa=ஹம்ச யோகம் (பஞ்ச மகாபுருஷ யோகம்)
yoga.hamsa.desc=குரு கேந்திரத்தில் ஆட்சி/உச்சம் பெற்றுள்ளார். ஞானம், ஆன்மீக சிந்தனை மற்றும் மரியாதையைத் தரும்.
yoga.malavya=மாளவ்ய யோகம் (பஞ்ச மகாபுருஷ யோகம்)
yoga.malavya.desc=சுக்கிரன் கேந்திரத்தில் ஆட்சி/உச்சம் பெற்றுள்ளார். சுகபோகம், கலைத்திறன் மற்றும் கவர்ச்சி தரும்.
yoga.sasa=சச யோகம் (பஞ்ச மகாபுருஷ யோகம்)
yoga.sasa.desc=சனி கேந்திரத்தில் ஆட்சி/உச்சம் பெற்றுள்ளார். அதிகார பலம், பொறுமை மற்றும் விடாமுயற்சி தரும்.
yoga.neechabhanga=நீசபங்க ராஜயோகம்
yoga.neechabhanga.desc=நீசமடைந்த கிரகத்தின் ராசிநாதன் கேந்திரத்தில் உள்ளதால் நீசபங்கம் அடைந்து யோகம் தரும்.
yoga.dharma_karmadhipati=தர்ம-கர்மாதிபதி யோகம்
yoga.dharma_karmadhipati.desc=9-ஆம் அதிபதி (தர்மம்) மற்றும் 10-ஆம் அதிபதி (கர்மா) சேர்க்கை அல்லது பார்வை பெற்றுள்ளனர். உயர்ந்த தொழில் வெற்றியையும் அதிகாரத்தையும் தரும்.
yoga.rajayogam=கேந்திர-திரிகோண ராஜயோகம்
yoga.rajayogam.desc=கேந்திர அதிபதியும் திரிகோண அதிபதியும் சேர்க்கை பெற்றுள்ளனர். பெரும் செல்வம், அந்தஸ்து மற்றும் யோக பலன்களைத் தரும்.
yoga.vipareeta=விபரீத ராஜயோகம்
yoga.vipareeta.desc=மறைவிட அதிபதிகள் (6, 8, 12) மறைவிடங்களில் அமர்ந்து எதிர்பாராத அதிர்ஷ்டத்தையும் வெற்றியையும் தருவார்கள்.
yoga.lakshmi=லக்ஷ்மி யோகம்
yoga.lakshmi.desc=9-ஆம் அதிபதி ஆட்சி/உச்சம் பெற்று பலமாக உள்ளார். பெரும் செல்வம் மற்றும் பாக்கியங்களைத் தரும்.
yoga.amala=அமல யோகம்
yoga.amala.desc=10-ஆம் இடத்தில் சுபகிரகம் அமர்ந்துள்ளதால் களங்கமற்ற நற்பெயரும் தொழில் மேன்மையும் கிட்டும்.
yoga.vesi=வேசி யோகம்
yoga.vesi.desc=சூரியனுக்கு 2-ஆம் வீட்டில் சுபகிரகம் அமர்ந்து சொல்வன்மையும் தனலாபமும் தரும்.
yoga.vosi=வோசி யோகம்
yoga.vosi.desc=சூரியனுக்கு 12-ஆம் வீட்டில் சுபகிரகம் அமர்ந்து தர்ம குணமும் ஆன்மீக வெற்றியும் தரும்.
yoga.obhayachari=உபயசாரி யோகம்
yoga.obhayachari.desc=சூரியனுக்கு இருபுறமும் (2 மற்றும் 12) சுபகிரகங்கள் அமர்ந்து பெரும் புகழையும் யோகத்தையும் தரும்.
yoga.sunapha=சுனபா யோகம்
yoga.sunapha.desc=சந்திரனுக்கு 2-ஆம் வீட்டில் சுபகிரகங்கள் அமர்ந்து சுயமாக ஈட்டும் தனலாபத்தைத் தரும்.
yoga.anapha=அனபா யோகம்
yoga.anapha.desc=சந்திரனுக்கு 12-ஆம் வீட்டில் கிரகங்கள் அமர்ந்து நல்ல ஆரோக்கியமும் மன அமைதியும் தரும்.
yoga.dhurudhura=துருதுரா யோகம்
yoga.dhurudhura.desc=சந்திரனுக்கு இருபுறமும் கிரகங்கள் அமர்ந்து சகல சௌபாக்கியங்களும் தலைமைத்துவமும் தரும்.
yoga.kemadruma=கேமத்துரும யோகம்
yoga.kemadruma.desc=சந்திரனுக்கு இருபுறமும் கிரகங்கள் இன்றி மன அமைதியின்மை ஏற்படலாம் (பங்கமடைந்தால் தோஷம் நீங்கும்).
yoga.pravrajya=பிரவ்ரஜ்யா / சன்யாச யோகம்
yoga.pravrajya.desc=ஒரே ராசியில் 4 அல்லது அதற்கு மேற்பட்ட கிரகங்கள் சேர்க்கை பெற்று ஆழ்ந்த ஞானமும் துறைசார் ஆளுமையும் தரும்.
yoga.maha_parivartana=மகா பரிவர்த்தனை யோகம்
yoga.maha_parivartana.desc=கேந்திர-திரிகோண அதிபதிகள் பரஸ்பரம் ராசி மாறி அமர்ந்து உயர்ந்த அந்தஸ்தையும் செல்வத்தையும் தருவார்கள்.
yoga.khala_parivartana=கல பரிவர்த்தனை யோகம்
yoga.khala_parivartana.desc=3-ஆம் அதிபதியுடன் பரிவர்த்தனை ஏற்பட்டு விடாமுயற்சிக்குப் பின் பெரும் வெற்றியைத் தரும்.
yoga.dainya_parivartana=தைன்ய பரிவர்த்தனை யோகம்
yoga.dainya_parivartana.desc=மறைவிட அதிபதிகளுடன் பரிவர்த்தனை ஏற்பட்டு ஆன்மீக விழிப்புணர்வைத் தரும்.
yoga.bhagyalakshmi=பாக்கியலட்சுமி யோகம்
yoga.bhagyalakshmi.desc=9-ஆம் அதிபதி ஆட்சி/உச்சம் பெற்று குரு, சுக்கிரன் கேந்திர/திரிகோணத்தில் சுப பலம் பெற்றுள்ளனர்.
yoga.rajalakshmi=ராஜலட்சுமி யோகம்
yoga.rajalakshmi.desc=குரு, சுக்கிரன், புதன், சந்திரன் கேந்திர/திரிகோணங்களில் பாபர்களின் சேர்க்கையின்றி ராஜ யோகம் தருகின்றனர்.
yoga.adhi=அதி யோகம்
yoga.adhi.desc=லக்னம் அல்லது சந்திரனுக்கு 6, 7, 8-இல் சுபகிரகங்கள் அமர்ந்து தலைமைத்துவமும் எதிரிகளை வெல்லும் ஆற்றலும் தரும்.
yoga.vasumathi=வசுமதி யோகம்
yoga.vasumathi.desc=அனைத்து சுபகிரகங்களும் உபசய ஸ்தானங்களில் (3, 6, 10, 11) அமர்ந்து அழியாத தனலாபத்தை தரும்.
yoga.akhanda_samrajya=அகண்ட சாம்ராஜ்ய யோகம்
yoga.akhanda_samrajya.desc=சர/ஸ்திர லக்னத்திற்கு குரு மற்றும் தன/பாக்கிய/லாபாதிபதிகள் கேந்திரத்தில் அமர்ந்து பெரும் ஆதிக்க யோகம் தரும்.
yoga.saraswati=சரஸ்வதி யோகம்
yoga.saraswati.desc=குரு, சுக்கிரன், புதன் 1, 2, 4, 5, 7, 9, 10-இல் சுப பலத்துடன் அமர்ந்து மகா வித்யா மேன்மையை தரும்.
yoga.kalanidhi=கலாநிதி யோகம்
yoga.kalanidhi.desc=குரு 2 அல்லது 5-ஆம் வீட்டில் புதன், சுக்கிரனுடன் தொடர்பு பெற்று பன்முகத் திறமையும் நிபுணத்துவமும் தரும்.
yoga.kahala=காகள யோகம்
yoga.kahala.desc=4 மற்றும் 9-ஆம் அதிபதிகள் பரஸ்பர கேந்திரத்தில் பலமாக அமர்ந்து தைரியமும் தலைமை ஆளுமையும் தருவார்கள்.
yoga.parvata=பர்வத யோகம்
yoga.parvata.desc=கேந்திரங்களில் சுபகிரகங்கள் அமர்ந்து 6, 8-ஆம் வீடுகள் பாபரின்றி யோக வாழ்வை தரும்.
yoga.pushkala=புஷ்கல யோகம்
yoga.pushkala.desc=சந்திரனின் ராசிநாதன் லக்னாதிபதியுடன் கேந்திர/திரிகோணத்தில் கூடி லக்னத்தை பார்த்து பெரும் செல்வாக்கு தரும்.
yoga.shakata=சகட யோகம்
yoga.shakata.desc=சந்திரனுக்கு 6, 8, 12-இல் குரு அமர்ந்து ஏற்ற இறக்கமான வாழ்வைத் தரும் (பங்கமடைந்தால் தோஷம் நீங்கும்).
yoga.shubhakarthari=சுபகர்த்தாரி யோகம்
yoga.shubhakarthari.desc=லக்னம்/சந்திரன்/10-ஆம் வீட்டிற்கு இருபுறமும் (2 மற்றும் 12) சுபகிரகங்கள் அமர்ந்து பாதுகாப்பு தரும்.
yoga.mahabhagya=மகாபாக்ய யோகம்
yoga.mahabhagya.desc=பகல்/இரவு பிறப்பு மற்றும் ராசி நிலைகளின் அபூர்வ அமைப்பால் வாழ்நாள் முழுவதும் யோக பலன்களைத் தரும்.
yoga.chamara=சாமர யோகம்
yoga.chamara.desc=லக்னாதிபதி உச்சம் பெற்று குரு பார்வை பெறுவதால் உயர்ந்த கௌரவமும் நீண்ட ஆயுளும் தரும்.
yoga.parijata=பாரிஜாத யோகம்
yoga.parijata.desc=லக்னாதிபதியின் சாரநாதன் மற்றும் அவரின் அதிபதி கேந்திர திரிகோணங்களில் ஆட்சி/உச்சம் பெற்று அமைவது. வாழ்வின் பிற்பகுதியில் பெரும் புகழ் மற்றும் அந்தஸ்து தரும்.
yoga.chatussagara=சதுஸாகர யோகம் (நால்வகை சமுத்திர யோகம்)
yoga.chatussagara.desc=1, 4, 7, 10 ஆகிய நான்கு கேந்திர ஸ்தானங்களிலும் கிரகங்கள் நிறைந்து அமைவது. அசைக்க முடியாத தொழில் நிலைப்புத்தன்மை மற்றும் நிரந்தர செல்வ வளம் தரும்.
yoga.mala=மாலா யோகம் (சுப கிரக மாலை யோகம்)
yoga.mala.desc=குரு, சுக்கிரன், புதன் ஆகிய மூவரும் கேந்திரங்களில் அமர்ந்து பாப கிரகங்கள் கேந்திரத்தில் இல்லாதிருப்பது. நிறைந்த செல்வம், நற்குணங்கள் மற்றும் சமூக மரியாதை தரும்.
yoga.indra=இந்திர யோகம்
yoga.indra.desc=5 மற்றும் 11-ஆம் அதிபதிகள் பரிவர்த்தனை பெறுவது அல்லது 11-ஆம் அதிபதி 5-லும் சந்திரன் 11-லும் அமைவது. அரச யோகம் மற்றும் உயர்பதவிகளைத் தரும்.
yoga.kendra_trikona_sambandha=கேந்திர-திரிகோண சம்பந்த ராஜயோகம்
yoga.kendra_trikona_sambandha.desc=கேந்திர அதிபதியும் திரிகோண அதிபதியும் சேர்க்கை, சமசப்தம பார்வை அல்லது பரிவர்த்தனை பெறுவது. மகத்தான அதிர்ஷ்டம் மற்றும் யோக வாழ்வைத் தரும்.

dosham.guru_chandala=குரு-சண்டாள தோஷம்
remedy.guru_chandala=ஸ்ரீ தட்சிணாமூர்த்தி வழிபாடு மற்றும் சிவ பஞ்சாட்சரம் ஜெபிப்பது நலம் தரும்.
dosham.angarak=அங்காரக தோஷம்
remedy.angarak=செவ்வாய்க்கிழமைகளில் ஸ்ரீ முருகப்பெருமான் வழிபாடு செய்து நெய்தீபம் ஏற்றுவது நன்று.
dosham.punarphoo=புனர்பூ தோஷம் (விஷ யோகம்)
remedy.punarphoo=திங்கட்கிழமைகளில் சிவபெருமானுக்கு ஜலாபிஷேகம் மற்றும் மகா மிருத்யுஞ்சய மந்திரம் ஜெபிப்பது சிறப்பு.
dosham.papakarthari=பாபகர்த்தாரி தோஷம்
remedy.papakarthari=தினசரி காயத்ரி மந்திரம் ஜெபித்து நவக்கிரக பிரதட்சணம் செய்வது நன்று.
dosham.grahan=கிரகண தோஷம்
remedy.grahan=சிவபெருமானுக்கு ருத்ராபிஷேகம் செய்து சூரிய/சந்திர காயத்ரி ஜெபிக்கவும்.
dosham.daridra=தரித்திர யோகம்
remedy.daridra=வெள்ளிக்கிழமைகளில் ஸ்ரீ லக்ஷ்மி குபேர பூஜை செய்து தான தர்மங்கள் செய்யவும்.
dosham.duryoga=துர்யோகம்
remedy.duryoga=ஸ்ரீ விநாயகர் வழிபாடு செய்து தினமும் சூரிய நமஸ்காரம் செய்யவும்.
dosham.sarpa=சர்ப்ப தோஷம்
remedy.sarpa=நாகர் சிலைக்கு பாலபிஷேகம் செய்து ராகு-கேது தலங்களில் வழிபாடு செய்யவும்.
dosham.kendra_adhipatya=கேந்திராதிபத்திய தோஷம்
remedy.kendra_adhipatya=வியாழக்கிழமைகளில் தட்சிணாமூர்த்தி வழிபாடு மற்றும் சிவபெருமானுக்கு வில்வ அர்ச்சனை செய்க.
dosham.bhadhakadhipati=பாதகாதிபதி தோஷம்
remedy.bhadhakadhipati=குலதெய்வ வழிபாடு மற்றும் இஷ்ட தெய்வத்திற்கு நெய்தீபம் ஏற்றி வழிபடுக.
dosham.gandanta=கண்டாந்த தோஷம் (சந்தி தோஷம்)
remedy.gandanta=கண்டாந்த சாந்தி ஹோமம், மகா மிருத்யுஞ்சய மந்திர ஜெபம் மற்றும் அன்னதானம் செய்க.
