nullification.kendradhipatya.trikona=திரிகோண ஸ்தானத்தில் (5, 9) அமர்ந்து தோஷம் நீங்கியது.
nullification.kendradhipatya.malefic=பாப கிரக சேர்க்கையால் கேந்திராதிபத்ய தோஷம் நீங்கியது.
nullification.sevvai.cancer_leo=கடக/சிம்ம லக்ன யோககாரகன் செவ்வாய் விலக்கு.
nullification.sevvai.eleventh=11-ஆம் இட லாப செவ்வாய் விலக்கு.
nullification.shani.sasa=சச யோக / உச்ச சுவக்ஷேத்திர பலத்தால் தோஷம் நீங்கியது.
nullification.guru.exalted=குரு உச்சம்/ஆட்சி பெற்றதால் சுப யோகமாக மாறுதல்.
nullification.guru.trikona=திரிகோண ஸ்தானத்தில் அமைந்ததால் ஞான யோகமாக மாற்றம்.
nullification.papakartari.lagna_benefic=லக்னத்தில் சுபகிரகம் அமர்ந்துள்ளதால் பாபகர்த்தாரி பங்கமடைந்தது.
nullification.eleventh_lord.exalted=11-ஆம் அதிபதி உச்சம் பெற்று தோஷம் நீங்கியது.
nullification.tenth_lord.swakshetra=10-ஆம் அதிபதி ஆட்சி பலத்தால் தோஷம் நீங்கியது.
nullification.lagna_lord.conjunct=லக்னாதிபதி சேர்க்கையால் தோஷம் நீங்கியது.