gowri.amirdha=அமிர்தம் (அனைத்து சுப காரியங்களுக்கும் மிக உத்தமம்)
gowri.laabam=லாபம் (வியாபாரம், முதலீடு & புதிய முயற்சிகளுக்கு உத்தமம்)
gowri.dhanam=தனம் (பண பரிவர்த்தனை & நகை வாங்க உத்தமம்)
gowri.sugam=சுகம் (குடும்ப சுப நிகழ்ச்சிகள் & ஆரோக்கியத்திற்கு நல்லது)
gowri.uthi=உதி (வேலை வாய்ப்பு, நேர்காணல் & அரசு பணிகளுக்கு நல்லது)
gowri.visham=விஷம் (கெட்ட நேரம் - தவிர்க்க வேண்டும்)
gowri.rogam=ரோகம் (கெட்ட நேரம் - தவிர்க்க வேண்டும்)
gowri.soram=சோரம் (கெட்ட நேரம் - தவிர்க்க வேண்டும்)
