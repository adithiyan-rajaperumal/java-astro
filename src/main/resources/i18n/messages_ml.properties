nullification.sevvai.own_exalted=ചൊവ്വ സ്വക്ഷേത്രത്തിലോ ഉച്ച രാശിയിലോ ആണ്.
nullification.sevvai.jupiter_aspect=വ്യാഴം ചൊവ്വയെ നോക്കുന്നു അല്ലെങ്കിൽ യോഗത്തിലാണ്.
nullification.sevvai.venus_aspect=ശുക്രൻ ചൊവ്വയെ നോക്കുന്നു.
nullification.sevvai.benefic_sign=1 അല്ലെങ്കിൽ 2-ാം ഭാവത്തിൽ ശുഭ രാശിയിലാണ് ചൊവ്വ.

nullification.kalasarpa.conjunct=ഒരു ഗ്രഹം രാഹു അല്ലെങ്കിൽ കേതുവുമായി യോഗത്തിലാണ്.
nullification.kalasarpa.jupiter_aspect=വ്യാഴം രാഹുവിനെയോ കേതുവിനെയോ നോക്കുന്നു.

nullification.sarpam.jupiter_kendra=വ്യാഴം രാഹുവിൽ നിന്ന് കേന്ദ്രത്തിലാണ്.
nullification.sarpam.jupiter_aspect=വ്യാഴം രാഹുവിനെയോ കേതുവിനെയോ നോക്കുന്നു.
nullification.sarpam.own_exalted=രാഹു/കേതു സ്വക്ഷേത്രത്തിലോ ഉച്ചത്തിലോ ആണ്.

nullification.pithru.jupiter_aspect=വ്യാഴം 9-ാം ഭാവത്തെയോ സൂര്യനെയോ നോക്കുന്നു.
nullification.pithru.own_exalted=സൂര്യൻ സ്വക്ഷേത്രത്തിലോ ഉച്ചത്തിലോ ആണ്.
nullification.pithru.benefic=ശുഭ ഗ്രഹങ്ങൾ സൂര്യനുമായി യോഗത്തിലാണ്.

nullification.putra.jupiter=വ്യാഴം 5-ാം ഭാവത്തിലാണ് അല്ലെങ്കിൽ 5-ാം ഭാവത്തെ നോക്കുന്നു.
nullification.putra.benefic=5-ാം ഭാവത്തിൽ ശുഭ ഗ്രഹങ്ങളുണ്ട്.

nullification.kalathira.venus_strong=ശുക്രൻ സ്വക്ഷേത്രത്തിലോ ഉച്ചത്തിലോ ആണ്.
nullification.kalathira.jupiter_aspect=വ്യാഴം 7-ാം ഭാവത്തെ നോക്കുന്നു.

nullification.shani.own_exalted=ശനി സ്വക്ഷേത്രത്തിലോ ഉച്ചത്തിലോ ആണ്.
nullification.shani.jupiter_aspect=വ്യാഴം ശനിയെ നോക്കുന്നു.
nullification.shani.yogakaraka=ശനി ഈ ലഗ്നത്തിന്റെ യോഗകാരകനാണ്.
nullification.angarak.upachaya=ഉപചയ ഭാവത്തിൽ (3/6/11) നിൽക്കുന്നതിനാൽ ശത്രു ജയ യോഗമായി മാറുന്നു.
nullification.bhadhakadhipati.upachaya=ബാധകാധിപൻ ഉപചയ ഭാവത്തിൽ (3/6/11) സ്ഥിതി ചെയ്യുന്നതിനാൽ ദോഷ നിവൃത്തി ഉണ്ടാകുന്നു.

remedy.sevvai=സുബ്രഹ്മണ്യ പൂജയും വൈദീശ്വരൻ കോവിൽ വഴിപാടും നടത്തുക.
remedy.kalasarpa=ശിവപൂജയും ചിട്ടയായ ജീവിതവും നയിക്കുക.
remedy.sarpam=രാഹുകാലത്ത് ദുർഗ്ഗാപൂജ നടത്തുക.
remedy.pithru=പിതൃതർപ്പണം നടത്തുക.
remedy.putra=സന്താനഗോപാല മന്ത്രം ജപിക്കുക.
remedy.kalathira=ദമ്പതിപൂജയും വഴിപാടുകളും നടത്തുക.
nullification.sevvai.house_sign_exemption=പ്രത്യേക ഭാവവും രാശി ഇളവും കാരണം ചൊവ്വാദോഷം ഒഴിവാകുന്നു.

yoga.gajakesari=ഗജകേസരി യോഗം
yoga.gajakesari.desc=ചന്ദ്രനിൽ നിന്ന് കേന്ദ്രത്തിൽ വ്യാഴം സ്ഥിതി ചെയ്യുന്നു. ധനവും ബുദ്ധിയും തരുന്നു.
yoga.budha_aditya=ബുധാദിത്യ യോഗം
yoga.budha_aditya.desc=സൂര്യനും ബുധനും യോഗത്തിലാണ്. മികച്ച ബുദ്ധിശക്തി നൽകുന്നു.
yoga.chandra_mangal=ചന്ദ്ര മംഗള യോഗം
yoga.chandra_mangal.desc=ചന്ദ്രനും ചൊവ്വയും യോഗത്തിലാണ്. സാമ്പത്തിക അഭിവൃദ്ധി തരുന്നു.
yoga.ruchaka=രുചക യോഗം (പഞ്ച മഹാപുരുഷ യോഗം)
yoga.ruchaka.desc=ചൊവ്വ കേന്ദ്രത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. നേതൃത്വവും ധൈര്യവും നൽകുന്നു.
yoga.bhadra=ഭദ്ര യോഗം (പഞ്ച മഹാപുരുഷ യോഗം)
yoga.bhadra.desc=ബുധൻ കേന്ദ്രത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. ബിസിനസ്സ് ബുദ്ധിയും ദീർഘായുസ്സും തരുന്നു.
yoga.hamsa=ഹംസ യോഗം (പഞ്ച മഹാപുരുഷ യോഗം)
yoga.hamsa.desc=വ്യാഴം കേന്ദ്രത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. ജ്ഞാനവും ആദരവും തരുന്നു.
yoga.malavya=മാളവ്യ യോഗം (പഞ്ച മഹാപുരുഷ യോഗം)
yoga.malavya.desc=ശുക്രൻ കേന്ദ്രത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. സുഖഭോഗങ്ങളും കലാവാസനയും തരുന്നു.
yoga.sasa=ശശ യോഗം (പഞ്ച മഹാപുരുഷ യോഗം)
yoga.sasa.desc=ശനി കേന്ദ്രത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. അധികാരവും ക്ഷമയും നൽകുന്നു.
yoga.neechabhanga=നീചഭംഗ രാജയോഗം
yoga.neechabhanga.desc=നീച ഗ്രഹത്തിന്റെ രാശ്യാധിപൻ കേന്ദ്രത്തിൽ നിൽക്കുന്നതിനാൽ നീചഭംഗ രാജയോഗം നൽകുന്നു.
yoga.dharma_karmadhipati=ധർമ്മ-കർമ്മാധിപതി യോഗം
yoga.dharma_karmadhipati.desc=9-ാം അധിപനും 10-ാം അധിപനും ചേരുകയോ പരസ്പരം നോക്കുകയോ ചെയ്യുന്നു. വലിയ തൊഴിൽ വിജയവും സ്ഥാനമാനങ്ങളും നൽകുന്നു.
yoga.rajayogam=കേന്ദ്ര-ത്രികോണ രാജയോഗം
yoga.rajayogam.desc=കേന്ദ്ര അധിപനും ത്രികോണ അധിപനും യോഗത്തിലാണ്. വൻ സഭാഗ്യവും അഭിവൃദ്ധിയും തരുന്നു.
yoga.lakshmi=ലക്ഷ്മീ യോഗം
yoga.lakshmi.desc=9-ാം അധിപൻ കേന്ദ്ര/ത്രികോണത്തിൽ സ്വ/ഉച്ച രാശിയിൽ നിൽക്കുകയും ലഗ്നാധിപൻ ബലവാനായിരിക്കുകയും ചെയ്യുന്നു. വലിയ സമ്പത്തും സൽഗുണങ്ങളും നൽകുന്നു.
yoga.amala=അമല യോഗം
yoga.amala.desc=ലഗ്നത്തിൽ നിന്നോ ചന്ദ്രനിൽ നിന്നോ 10-ാം ഭാവത്തിൽ ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത് കളങ്കമില്ലാത്ത പ്രശസ്തിയും പദവിയും നൽകുന്നു.
yoga.parijata=പാരിജാത യോഗം
yoga.parijata.desc=ലഗ്നാധിപന്റെ ഡിസ്പോസിറ്റർ കേന്ദ്ര/ത്രികോണത്തിൽ സ്വ/ഉച്ച രാശിയിലാണ്. ജീവിതത്തിന്റെ രണ്ടാം പകുതിയിൽ വലിയ പ്രശസ്തി നൽകുന്നു.
yoga.chatussagara=ചതുഃസാഗര യോഗം
yoga.chatussagara.desc=നാല് കേന്ദ്രങ്ങളിലും (1, 4, 7, 10) ഗ്രഹങ്ങൾ നിൽക്കുന്നത്. തൊഴിൽ സ്ഥിരതയും സാമ്പത്തിക ഭദ്രതയും നൽകുന്നു.
yoga.mala=മാലാ യോഗം
yoga.mala.desc=ശുഭഗ്രഹങ്ങൾ (വ്യാഴം, ശുക്രൻ, ബുധൻ) കേന്ദ്രങ്ങളിൽ നിൽക്കുകയും പാപഗ്രഹങ്ങൾ ഇല്ലാതിരിക്കുകയും ചെയ്യുന്നത്. മഹത്തായ സമ്പത്ത് നൽകുന്നു.
yoga.indra=ഇന്ദ്ര യോഗം
yoga.indra.desc=5, 11 അധിപന്മാരുടെ പരിവർത്തനം അല്ലെങ്കിൽ 11-ാം അധിപൻ 5-ലും ചന്ദ്രൻ 11-ലും നിൽക്കുന്നത്. രാജയോഗവും ഉന്നത പദവിയും നൽകുന്നു.
yoga.kendra_trikona_sambandha=കേന്ദ്ര-ത്രികോണ സംബന്ധ രാജയോഗം
yoga.kendra_trikona_sambandha.desc=കേന്ദ്ര-ത്രികോണ അധിപന്മാരുടെ ചേർച്ച, ദൃഷ്ടി അല്ലെങ്കിൽ പരിവർത്തനം. ജീവിതത്തിൽ വലിയ വിജയം നൽകുന്നു.
yoga.bhagyalakshmi=ഭാഗ്യലക്ഷ്മീ യോഗം
yoga.bhagyalakshmi.desc=9-ാം അധിപൻ കേന്ദ്ര/ത്രികോണത്തിൽ സ്വ/ഉച്ച രാശിയിലും വ്യാഴം, ശുക്രൻ കേന്ദ്ര/ത്രികോണങ്ങളിലും നിൽക്കുന്നു. സകല സൗഭാഗ്യങ്ങളും നൽകുന്നു.
yoga.rajalakshmi=രാജലക്ഷ്മീ യോഗം
yoga.rajalakshmi.desc=വ്യാഴം, ശുക്രൻ, ബുധൻ, ചന്ദ്രൻ എന്നിവർ പാപബാധയില്ലാതെ കേന്ദ്ര/ത്രികോണങ്ങളിൽ നിൽക്കുന്നു. രാജഭോഗം നൽകുന്നു.
yoga.adhi=അധി യോഗം
yoga.adhi.desc=ചന്ദ്രനിൽ നിന്നോ ലഗ്നത്തിൽ നിന്നോ 6, 7, 8-ൽ ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത്. നേതൃത്വഗുണവും ശത്രുജയവും നൽകുന്നു.
yoga.vasumathi=വസുമതി യോഗം
yoga.vasumathi.desc=എല്ലാ ശുഭഗ്രഹങ്ങളും ഉപചയ (3, 6, 10, 11) ഭാവങ്ങളിൽ നിൽക്കുന്നത്. സാമ്പത്തിക സ്വാതന്ത്ര്യം നൽകുന്നു.
yoga.akhanda_samrajya=അഖണ്ഡ സാമ്രാജ്യ യോഗം
yoga.akhanda_samrajya.desc=സ്ഥിര/ചര ലഗ്നത്തിൽ വ്യാഴവും 2/9/11 അധിപന്മാരും കേന്ദ്രത്തിൽ നിൽക്കുന്നു. ശാശ്വത അധികാരം നൽകുന്നു.
yoga.saraswati=സരസ്വതീ യോഗം
yoga.saraswati.desc=വ്യാഴം, ശുക്രൻ, ബുധൻ കേന്ദ്ര/ത്രികോണ/2-ൽ നിൽക്കുന്നു. അഗാധമായ ജ്ഞാനവും വിദ്യയും നൽകുന്നു.
yoga.kalanidhi=കലാനിധി യോഗം
yoga.kalanidhi.desc=വ്യാഴം 2 അല്ലെങ്കിൽ 5-ൽ ബുധ-ശുക്രന്മാരാൽ ദൃഷ്ടി ചെയ്യപ്പെടുന്നു. ബഹുമുഖ പ്രതിഭ നൽകുന്നു.
yoga.kahala=കാഹള യോഗം
yoga.kahala.desc=4, 9 അധിപന്മാർ പരസ്പരം കേന്ദ്രത്തിൽ നിൽക്കുന്നു. ധൈര്യവും വാഹന സൗഖ്യവും നൽകുന്നു.
yoga.parvata=പർവ്വത യോഗം
yoga.parvata.desc=കേന്ദ്രങ്ങളിൽ ശുഭഗ്രഹങ്ങൾ നിൽക്കുകയും 6/8-ൽ പാപഗ്രഹങ്ങൾ ഇല്ലാതിരിക്കുകയും ചെയ്യുന്നത്. സുസ്ഥിര കീർത്തി നൽകുന്നു.
yoga.pushkala=പുഷ്കല യോഗം
yoga.pushkala.desc=ചന്ദ്രന്റെ ഡിസ്പോസിറ്റർ ലഗ്നാധിപനോടൊപ്പം കേന്ദ്ര/ത്രികോണത്തിൽ ലഗ്നത്തെ നോക്കുന്നു. ആകർഷകമായ വ്യക്തിത്വം നൽകുന്നു.
yoga.shakata=ശകട യോഗം
yoga.shakata.desc=വ്യാഴത്തിൽ നിന്ന് 6/8/12-ൽ ചന്ദ്രൻ നിൽക്കുന്നത് ജീവിതത്തിൽ ഉയർച്ച താഴ്ചകൾ ഉണ്ടാക്കുന്നു.
yoga.shubhakarthari=ശുഭകർതരീ യോഗം
yoga.shubhakarthari.desc=ലഗ്നം, ചന്ദ്രൻ അല്ലെങ്കിൽ 10-ാം ഭാവത്തിന് ഇരുവശത്തും (2, 12) ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത് സംരക്ഷണം നൽകുന്നു.
yoga.mahabhagya=മഹാഭാഗ്യ യോഗം
yoga.mahabhagya.desc=പകൽ/രാത്രി ജനനവും ലഗ്ന/സൂര്യ/ചന്ദ്രന്മാരുടെ രാശിസ്ഥിതിയും വഴി ആയുഷ്‌കാല ഭാഗ്യം നൽകുന്നു.
yoga.chamara=ചാമര യോഗം
yoga.chamara.desc=ഉച്ച ലഗ്നാധിപൻ കേന്ദ്രത്തിൽ വ്യാഴദൃഷ്ടിയോടെ നിൽക്കുന്നു. ദീർഘായുസ്സും ആദരവും നൽകുന്നു.
yoga.vesi=വേസി യോഗം
yoga.vesi.desc=സൂര്യനിൽ നിന്ന് 2-ൽ ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത്. വാക്ചാതുര്യവും സമ്പത്തും നൽകുന്നു.
yoga.vosi=വോസി യോഗം
yoga.vosi.desc=സൂര്യനിൽ നിന്ന് 12-ൽ ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത്. ആത്മീയതയും പ്രശസ്തിയും നൽകുന്നു.
yoga.obhayachari=ഉഭയചാരി യോഗം
yoga.obhayachari.desc=സൂര്യന്റെ ഇരുവശത്തും (2, 12) ശുഭഗ്രഹങ്ങൾ നിൽക്കുന്നത്. സ്ഥിരത നൽകുന്നു.
yoga.sunapha=സുനഫാ യോഗം
yoga.sunapha.desc=ചന്ദ്രനിൽ നിന്ന് 2-ൽ ഗ്രഹങ്ങൾ നിൽക്കുന്നത്. ബുദ്ധിസാമർത്ഥ്യവും സ്വത്തും നൽകുന്നു.
yoga.anapha=അനഫാ യോഗം
yoga.anapha.desc=ചന്ദ്രനിൽ നിന്ന് 12-ൽ ഗ്രഹങ്ങൾ നിൽക്കുന്നത്. സദാചാരവും ആരോഗ്യവും നൽകുന്നു.
yoga.dhurudhura=ധുരുധുരാ യോഗം
yoga.dhurudhura.desc=ചന്ദ്രന്റെ ഇരുവശത്തും (2, 12) ഗ്രഹങ്ങൾ നിൽക്കുന്നത്. വലിയ സമ്പത്ത് നൽകുന്നു.
yoga.kemadruma=കേമദ്രുമ യോഗം
yoga.kemadruma.desc=ചന്ദ്രന്റെ 2, 12-ൽ ഗ്രഹങ്ങൾ ഇല്ലാതിരിക്കുന്നത്. ഭംഗം വന്നാൽ ദോഷം മാറും.
yoga.pravrajya=പ്രവ്രജ്യ യോഗം
yoga.pravrajya.desc=ഒരേ ഭാവത്തിൽ 4 അല്ലെങ്കിൽ അതിൽ കൂടുതൽ ഗ്രഹങ്ങൾ നിൽക്കുന്നത്. ആത്മീയ ചിന്ത നൽകുന്നു.
yoga.vipareeta=വിപരീത രാജയോഗം
yoga.vipareeta.desc=6, 8, 12 അധിപന്മാർ ത്രിക ഭാവങ്ങളിൽ നിന്ന് അപ്രതീക്ഷിത വിജയം നൽകുന്നു.

dosham.sevvai=ചൊവ്വാദോഷം
dosham.kala_sarpa=കാലസർപ്പ ദോഷം
dosham.pithru=പിതൃ ദോഷം
dosham.putra=പുത്ര / സന്താന ദോഷം
dosham.kalathira=കളത്ര ദോഷം
dosham.shani=ശനി ദോഷം
dosham.guru_chandala=ഗുരു-ചണ്ഡാള ദോഷം
remedy.guru_chandala=ശിവനെയും ഗുരുവിനെയും പൂജിക്കുകയും ശിവ പഞ്ചാക്ഷരി ജപിക്കുകയും ചെയ്യുക.
dosham.angarak=അംഗാരക ദോഷം
remedy.angarak=ചൊവ്വാഴ്ചകളിൽ സുബ്രഹ്മണ്യ / ഹനുമാൻ പൂജ നടത്തുക.
dosham.punarphoo=പുനർഭൂ ദോഷം (വിഷ ദോഷം)
remedy.punarphoo=തിങ്കളാഴ്ചകളിൽ ശിവന് ജലാഭിഷേകം നടത്തുകയും മഹാമൃത്യുഞ്ജയ മന്ത്രം ജപിക്കുകയും ചെയ്യുക.
dosham.papakarthari=പാപകർതരീ ദോഷം
remedy.papakarthari=ഗായത്രീ മന്ത്രം ജപിക്കുകയും നവഗ്രഹ പ്രദക്ഷിണം ചെയ്യുകയും ചെയ്യുക.
dosham.grahan=ഗ്രഹണ ദോഷം
remedy.grahan=ശിവ രുദ്രാഭിഷേകം നടത്തുകയും സൂര്യ/ചന്ദ്ര ഗായത്രി ജപിക്കുകയും ചെയ്യുക.
dosham.daridra=ദാരിദ്ര്യ യോഗം
remedy.daridra=വെള്ളിയാഴ്ച മഹാലക്ഷ്മി പൂജ നടത്തുക.
dosham.duryoga=ദുര്യോഗം
remedy.duryoga=ഗണപതി പൂജ നടത്തുകയും നിത്യവും സൂര്യനമസ്കാരം ചെയ്യുകയും ചെയ്യുക.
dosham.sarpa=സർപ്പ ദോഷം
remedy.sarpa=നാഗദേവതയ്ക്ക് പാലഭിഷേകം നടത്തുകയും രാഹു-കേതു ശാന്തി നടത്തുകയും ചെയ്യുക.
dosham.kendra_adhipatya=കേન્દ്രാധിപത്യ ദോഷം
remedy.kendra_adhipatya=വ്യാഴാഴ്ചകളിൽ ശിവനെയും ദക്ഷിണാമൂർത്തിയെയും പൂജിക്കുക.
dosham.bhadhakadhipati=ബാധകാധിപതി ദോഷം
remedy.bhadhakadhipati=ഇഷ്ടദേവതയെയും കുലദേവതയെയും ആരാധിക്കുക.
dosham.gandanta=ഗണ്ഡാന്ത ദോഷം
remedy.gandanta=ഗണ്ഡാന്ത ശാന്തി നടത്തുകയും മഹാമൃത്യുഞ്ജയ മന്ത്രം ജപിക്കുകയും ചെയ്യുക.
