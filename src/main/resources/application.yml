server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
spring:
  application:
    name: astro-engine
  jackson:
    encoding: UTF-8
    serialization:
      write_dates_as_timestamps: false
    deserialization:
      fail_on_unknown_properties: false

  # Force Spring MVC to read and write all Web messages using UTF-8
  http:
    encoding:
      charset: UTF-8
      force: true

  # Backup rule enforcing system message settings
  messages:
    encoding: UTF-8

astro:
  features:
    life-anchors-enabled: ${FEATURE_LIFE_ANCHORS_ENABLED:true}
    ayurdaya-enabled: ${FEATURE_AYURDAYA_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:enc:QVEuQWI4Uk42SnB2Q3pJcU1QWjh5SXhGVExXZmhWeUlONk9xb3I5RFFGNFVxSGcyTjFQRXc}
  backup-api-key: ${GEMINI_BACKUP_API_KEY:}
  enabled: ${GEMINI_ENABLED:true}
  life-predictions-enabled: ${GEMINI_LIFE_PREDICTIONS_ENABLED:true}
  daily-balan-enabled: ${GEMINI_DAILY_BALAN_ENABLED:true}
  matching-enabled: ${GEMINI_MATCHING_ENABLED:true}
  pdf-predictions-enabled: ${GEMINI_PDF_PREDICTIONS_ENABLED:true}
  # Forecast span mode: FULL_LIFESPAN (entire Ayurdaya lifespan) or NEXT_10_YEARS / NEXT_15_YEARS
  forecast-mode: ${GEMINI_FORECAST_MODE:FULL_LIFESPAN}
  # forecast-mode: NEXT_10_YEARS
  forecast-years: ${GEMINI_FORECAST_YEARS:0}
  model: ${GEMINI_MODEL:gemini-3.7-flash}
  temperature: ${GEMINI_TEMPERATURE:0.4}
  thinking-budget: ${GEMINI_THINKING_BUDGET:1024}

pdf:
  include-life-anchors: ${PDF_INCLUDE_LIFE_ANCHORS:false}
  include-ayurdaya: ${PDF_INCLUDE_AYURDAYA:false}
  include-yogas-doshams: ${PDF_INCLUDE_YOGAS_DOSHAMS:false}
